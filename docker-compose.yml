# Paste this into TrueNAS SCALE:  Apps -> Discover -> (three dots) -> Install via YAML
#
# Before you do, replace:
#   YOUR-POOL             with your ZFS pool name (and adjust the dataset paths to match yours)
#   sk-ant-...            with your Anthropic API key
#
# Create these two datasets first (Datasets -> Add Dataset):
#   /mnt/YOUR-POOL/apps/bourdain/data
#   /mnt/YOUR-POOL/apps/bourdain/photos

services:
  bourdain:
    image: ghcr.io/zeinbenjamin/bourdain:latest
    # Without this, Redeploy restarts the image already on the NAS instead of pulling the new build.
    pull_policy: always
    container_name: bourdain
    restart: unless-stopped
    # TrueNAS datasets with "app permissions" belong to the apps user (568). The image runs as
    # node (1000) by default, which can't open the SQLite file, so the container crash-loops.
    user: "568:568"
    environment:
      ANTHROPIC_API_KEY: "sk-ant-REPLACE-ME"
      CLAUDE_MODEL: "claude-sonnet-4-6"
      DATA_DIR: "/data"
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - /mnt/YOUR-POOL/apps/bourdain/data:/data
      - /mnt/YOUR-POOL/apps/bourdain/photos:/data/photos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
