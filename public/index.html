async function runParse(){
  const url=document.getElementById("srcUrl").value.trim(), text=document.getElementById("srcText").value.trim();
  const status=document.getElementById("importStatus"); const btn=document.getElementById("btnParse");
  if(!text && !state.images.length){ status.className="status err"; status.textContent="Paste the recipe text or add a screenshot first. For a link, paste it above and tap Fetch & read."; return; }
  parseCtl=new AbortController();
  btn.disabled=true; status.className="status"; status.innerHTML=`<span class="spin"></span>Reading the recipe… <button class="btn small ghost" id="stopParse">Stop</button>`;
  status.querySelector("#stopParse").onclick=()=>parseCtl.abort();
  try{
    const data = await store.ai("import", {url, text:text.slice(0,20000)}, state.images, parseCtl.signal);
    if(!data || data.error || !data.title){ status.className="status err";
      status.textContent=/^(youtube|instagram|tiktok)$/.test(sourceType(url))
        ? "That video's description doesn't include the recipe. Screen-record the video while it shows the recipe, and add the recording instead."
        : "Couldn't find a recipe in that. Try pasting more of the caption or a clearer screenshot.";
      btn.disabled=false; return; }
    state.draft=normalise(data,url); state.editingId=null; state.draftManual=false;
    status.textContent=""; btn.disabled=false; renderImport(); toTop();
  }catch(e){
    btn.disabled=false;
    if(e&&e.name==="AbortError"){ status.className="status"; status.textContent="Stopped. Nothing was imported."; return; }
    status.className="status err";
    status.textContent=aiError(e,"reading that");
  }
}
function normalise(d,url){
  const n=x=>(x===null||x===undefined||x==="")?null:(isFinite(Number(x))?Number(x):null);
  return { title:String(d.title||"").trim(), description:String(d.description||""), source_url:url||"", source_type:sourceType(url),
    servings:n(d.servings), prep_min:n(d.prep_min), cook_min:n(d.cook_min), notes:String(d.notes||""),
    ingredients:(Array.isArray(d.ingredients)?d.ingredients:[]).map(i=>({ raw_text:String(i.raw_text||""), quantity:n(i.quantity), unit:UNITS.includes(String(i.unit||"").toLowerCase())?String(i.unit).toLowerCase():"", item:String(i.item||i.raw_text||"").toLowerCase().trim(), prep:String(i.prep||"").toLowerCase(), section:String(i.section||""), aisle:AISLES.includes(i.aisle)?i.aisle:"other", optional:!!i.optional })),
    steps:(Array.isArray(d.steps)?d.steps:[]).map(s=>String(s).trim()).filter(Boolean),
    tags:(Array.isArray(d.tags)?d.tags:[]).map(t=>String(t).toLowerCase().trim()).filter(Boolean).slice(0,6) };
}

/* photos */
function shrink(file,max=1600){
  return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",.85); };
    img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("decode")); }; img.src=u; });
}
/* Upload now if the server answers; otherwise keep the photo on this phone and
   return a "local-…" id that photoQueue swaps for the real one later. */
async function uploadPhotos(files){
  const ids=[]; let queued=0;
  for(const f of files){
    let blob; try{ blob=await shrink(f); }catch(e){ console.warn(e); toast("Couldn't read that photo. Try a different one."); continue; }
    if(store.online){
      try{ ids.push((await store.uploadPhoto(blob)).id); continue; }
      catch(e){
        if(e&&e.code==="storage_full"){ toast(storageFull(e)); continue; }
        if(e&&(e.code==="image_failed"||(e.status>=400&&e.status<500))&&!keepForLater(e)){ toast("The server couldn't use that photo. Try a different one."); continue; }
        console.warn("photo upload failed, keeping it on this phone",e); store.online=false;
      }
    }
    try{ ids.push(await photoQueue.add(blob)); queued++; }
    catch(e){ console.warn(e); toast("Couldn't upload that photo, and this phone couldn't keep it for later."); }
  }
  const when=signin.out?"once you sign in again":"when the server's back";
  if(queued) toast(queued===1?`Photo saved on this phone. It'll upload ${when}.`:`${queued} photos saved on this phone. They'll upload ${when}.`);
  return ids;
}
const storageFull=e=>`Your photo storage is full${e.limit?` (${e.limit} MB)`:""}. Remove photos from recipes you don't need, or ask Zein for more room.`;
/* Photo and cover ids come from other people's recipes too, and the server doesn't
   check what's stored, so only a real id ever becomes part of an <img> tag.   */
const ASSET_ID=/^[a-f0-9]{32}$/;
function photoUrl(id){ id=String(id??""); return id.startsWith("local-") ? (photoQueue.urls[id]||"") : ASSET_ID.test(id) ? "/api/photos/"+id : ""; }

/* ---------- offline photo queue ----------
   Photos taken while the server is unreachable wait in IndexedDB (localStorage is
   far too small for images) under a "local-…" id, shown from a blob URL. store.flush()
   uploads them first, then swaps the id in every recipe (and an open draft) via
   store.enqueue, so the recipe write that follows carries the real id.        */
const photoQueue={
  urls:{}, dbp:null,
  get count(){ return Object.keys(this.urls).length; },
  get pending(){ return Object.keys(this.urls).filter(id=>this.used(id)).length; }, // left-behind draft photos don't count as unsynced
  open(){
    return this.dbp ||= new Promise((res,rej)=>{
      if(!self.indexedDB) return rej(new Error("IndexedDB not available"));
      const q=indexedDB.open("bourdain-photos",1);
      q.onupgradeneeded=()=>q.result.createObjectStore("photos",{keyPath:"id"});
      q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
    });
  },
  async run(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("photos",mode); const q=fn(t.objectStore("photos")); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); }); },
  all(){ return this.run("readonly",st=>st.getAll()); },
  async init(){ try{ for(const r of await this.all()) this.urls[r.id]=URL.createObjectURL(r.blob); }catch(e){ console.warn("photo queue unavailable",e); } },
  async add(blob){ const id="local-"+uid(); await this.run("readwrite",st=>st.put({id,blob,added:Date.now()})); this.urls[id]=URL.createObjectURL(blob); store.paint(); return id; },
  async drop(id){ await this.run("readwrite",st=>st.delete(id)); delete this.urls[id]; store.paint(); },
  used(id){ return (state.draft&&(state.draft.photos||[]).includes(id)) || Object.values(state.recipes).some(r=>(r.photos||[]).includes(id)); },
  swap(from,to){ // to=null removes the photo
    const fix=list=>to?list.map(p=>p===from?to:p):list.filter(p=>p!==from);
    for(const [rid,r] of Object.entries(state.recipes)) if((r.photos||[]).includes(from)){ r.photos=fix(r.photos); store.enqueue("recipes",rid,r); }
    if(state.draft&&(state.draft.photos||[]).includes(from)) state.draft.photos=fix(state.draft.photos);
  },
  async flush(){
    if(!this.count) return;
    let rows; try{ rows=await this.all(); }catch(e){ return; }
    let changed=false;
    for(const r of rows){
      if(!this.used(r.id)){ if(Date.now()-r.added>600000) await this.drop(r.id); continue; } // left behind by a discarded draft
      try{ const out=await store.uploadPhoto(r.blob); this.swap(r.id,out.id); await this.drop(r.id); changed=true; }
      catch(e){
        if(e&&(e.code==="image_failed"||(e.status>=400&&e.status<500))&&!keepForLater(e)){ this.swap(r.id,null); await this.drop(r.id); changed=true; toast(e.code==="storage_full"?storageFull(e)+" One photo kept on this phone was removed.":"The server couldn't use one of the saved photos, so it was removed."); }
        else { store.online=false; return; } // still unreachable: keep the rest for next time
      }
    }
    // Blob URLs stay valid until reload, so nothing on screen breaks; re-render so new ids are used.
    if(changed && !(state.view==="import"&&state.draft)) render();
  },
};
function coverUrl(id){ return ASSET_ID.test(String(id??"")) ? "/api/covers/"+id : ""; }

/* Covers: the server has Claude describe the dish and OpenAI paint it. Takes up to
   a minute, so it runs in a sheet with Stop. Closing the sheet lets it finish in
   the background; onDone still receives the new cover id. */
async function makeCover(recipe, onDone){
  if(!recipe.title){ toast("Give the recipe a title first, so there's something to paint."); return; }
  if(!store.online){ toast("Covers are painted on the server. Try again when you're back online."); return; }
  const ctl=new AbortController();
  const sh=openSheet(`<h3>Painting the cover</h3>
    <p class="status" id="coverStatus"><span class="spin"></span>Describing the dish, then painting it. This can take up to a minute.</p>
    <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="stop">Stop</button></div>`);
  sheetActions(sh,{ stop:()=>{ ctl.abort(); closeSheet(); toast("Stopped. No cover was made."); } });
  const mine=()=>sh.isConnected&&sh.classList.contains("open"); // our sheet is still the one on screen
  const input={ title:recipe.title, description:recipe.description||"", steps:recipe.steps||[],
    ingredients:(recipe.ingredients||[]).map(i=>({item:i.item, raw_text:i.raw_text})) };
  try{
    const out=await api("/api/cover",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({recipe:input}),signal:ctl.signal});
    allowance.took(out&&out.allowance);
    if(mine()) closeSheet();
    await onDone(out.id);
  }catch(e){
    if(e&&e.name==="AbortError") return;
    console.warn("cover failed",e);
    const msg=aiError(e,"painting the cover");
    if(mine()){ sh.querySelector("h3").textContent="Couldn't make the cover"; const st=sh.querySelector("#coverStatus"); st.className="status err"; st.textContent=msg;
      sh.querySelector('[data-act="stop"]').textContent="Close"; sheetActions(sh,{ stop:closeSheet }); }
    else toast(msg);
  }
}
/* Every cover made for a recipe is kept (2.6.0), newest first, up to COVERS_MAX, in
   `covers`; `cover` is the one shown. A new cover is used straight away (as before),
   then, if there are others, the picker opens with it chosen, so an earlier one is
   one tap away. Recipes from before 2.6.0 have no `covers`: their list is [cover].
   The server's cover sweep spares every id in `covers`. */
const COVERS_MAX=6;
function coversOf(r){
  const l=(r&&Array.isArray(r.covers)?r.covers:[]).filter(x=>typeof x==="string"&&/^[a-f0-9]{32}$/.test(x));
  if(r&&r.cover&&!l.includes(r.cover)) l.unshift(r.cover);
  return [...new Set(l)];
}
function withCover(r,id){ r.covers=[id,...coversOf(r).filter(x=>x!==id)].slice(0,COVERS_MAX); r.cover=id; return r; }
async function applyCover(recipeId,coverId){
  const r=state.recipes[recipeId]; if(!r) return;
  withCover(r,coverId); r.updated_at=new Date().toISOString();
  const ok=await store.put("recipes",recipeId,r);
  const here=state.view==="detail"&&state.detailId===recipeId;
  if(here) renderDetail(); else if(state.view==="recipes") renderRecipes();
  // offer the others only when nothing else is on screen in a sheet
  if(here&&coversOf(r).length>1&&!document.querySelector("#sheet.open")) coverPicker(recipeId,coverId,ok);
  else if(ok) toast("Cover added");
}
function coverPicker(recipeId,chosen,justMade){
  const r=state.recipes[recipeId]; if(!r) return;
  const list=coversOf(r); let pick=list.includes(chosen)?chosen:r.cover;
  const sh=openSheet(`<h3>${justMade?"New cover added":"Choose a cover"}</h3>
    <p class="muted small sheet-lead">${list.length} covers made for ${esc(r.title||"this recipe")}, newest first. Keep the new one, or pick one you liked better.</p>
    <div class="coverchoices">${list.map((id,i)=>`<div class="cc"><button class="ccpick${id===pick?" on":""}" data-act="pick" data-id="${esc(id)}" aria-pressed="${id===pick}" aria-label="Cover ${i+1}${id===r.cover?", in use":""}"><img src="${coverUrl(id)}" alt=""></button>${id!==r.cover?`<button class="x" data-act="drop" data-id="${esc(id)}" aria-label="Remove cover ${i+1}"><span>×</span></button>`:""}</div>`).join("")}</div>
    <div class="row sheet-row"><button class="btn primary" data-act="use">Use this cover</button><button class="btn ghost" data-act="close">Close</button></div>`);
  const save=async()=>{ r.updated_at=new Date().toISOString(); const ok=await store.put("recipes",recipeId,r); if(state.view==="detail"&&state.detailId===recipeId) renderDetail(); return ok; };
  sheetActions(sh,{
    close:closeSheet,
    pick:b=>{ pick=b.dataset.id; sh.querySelectorAll(".ccpick").forEach(x=>{ const on=x.dataset.id===pick; x.classList.toggle("on",on); x.setAttribute("aria-pressed",String(on)); }); },
    use:async()=>{ closeSheet(); if(pick===r.cover) return; r.cover=pick; if(await save()) toast("Cover changed"); },
    drop:async b=>{ r.covers=coversOf(r).filter(x=>x!==b.dataset.id); const ok=await save(); if(ok) toast("Cover removed");
      if(coversOf(r).length>1) coverPicker(recipeId,pick===b.dataset.id?r.cover:pick); else closeSheet(); },
  });
}
function pickPhotos(){ return new Promise(res=>{ const i=document.createElement("input"); i.type="file"; i.accept="image/*"; i.multiple=true; i.onchange=()=>res([...i.files]); i.click(); }); }
function photosHtml(ids,editable){
  return `<div class="photos">${(ids||[]).map(id=>`<div class="ph"><img src="${photoUrl(id)}" alt="">${editable?`<button class="x" data-rmp="${esc(id)}" aria-label="Remove photo"><span>×</span></button>`:""}</div>`).join("")}${editable?`<button class="add" data-addp>+ Photo</button>`:""}</div>`;
}

/* ---------- cost: home vs eating out (2.5) ----------
   See docs/cost-comparison.md. Each recipe gets one estimate, an AI job on the
   server: what it costs to make at Australian supermarket prices, and one serve
   eaten out at a casual place (2.5.2; it was the average with mid-range). It's kept
   on the recipe as `cost`, with a hash of what it was worked out from, and is
   redone only when the ingredients or servings change. Estimates run in the
   background, one at a time, and only when the server has a Claude key.
   Every serving made counts, leftovers included. */
const aud=n=>{ n=Number(n)||0; return n>=10?"$"+Math.round(n):"$"+n.toFixed(2).replace(/\.00$/,""); };
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
// The eating-out price is the casual one. Estimates from 2.5.0/2.5.1 also kept a mid-range price and
// stored their average as out_per_serve, so their casual price is read first.
const outOf=c=>Number(c&&c.casual_per_serve!=null?c.casual_per_serve:c&&c.out_per_serve);
const costOk=c=>Boolean(c&&Number(c.home_per_serve)>=0&&outOf(c)>=0);
// What one cook saved: (eating out − home) per serve × every serving made.
function cookSaved(cost,servings,mult){
  if(!costOk(cost)) return null;
  const serves=(Number(servings)>0?Number(servings):Number(cost.serves)||2)*(Number(mult)>0?Number(mult):1);
  return Math.max(0,(outOf(cost)-Number(cost.home_per_serve))*serves);
}
const costs={
  queue:[], busy:false, failed:{}, off:false,
  hash(r){ return hashStr(JSON.stringify([Number(r.servings)||null,(Array.isArray(r.ingredients)?r.ingredients:[]).map(i=>[i&&i.quantity!=null?Number(i.quantity):null,(i&&i.unit)||"",(i&&(i.item||i.raw_text))||""])])); },
  needs(r){ return Boolean(r&&r.title&&(Array.isArray(r.ingredients)?r.ingredients:[]).some(i=>i&&(i.item||i.raw_text))&&(!r.cost||r.cost.hash!==this.hash(r))); },
  ok(){ return !this.off&&Boolean(store.me&&store.me.ai)&&store.online&&!signin.out; },
  want(id){ const r=state.recipes[id]; if(!this.needs(r)||this.queue.includes(id)||Date.now()-(this.failed[id]||0)<3600000) return; this.queue.push(id); this.run(); },
  sweep(){ // cooked recipes first: they're what the Archives add up
    const ids=Object.keys(state.recipes).filter(id=>this.needs(state.recipes[id]));
    ids.sort((a,b)=>(((state.recipes[b].cooks||[]).length>0)-((state.recipes[a].cooks||[]).length>0)));
    ids.forEach(id=>this.want(id));
  },
  async run(){
    if(this.busy||!this.ok()) return;
    const id=this.queue.shift(); if(!id) return;
    this.busy=true;
    try{
      const r=state.recipes[id]; if(!this.needs(r)) return;
      const h=this.hash(r);
      const est=await store.ai("cost",{ title:r.title, servings:r.servings,
        ingredients:(r.ingredients||[]).filter(i=>i&&(i.item||i.raw_text)).map(i=>[i.quantity!=null?fmtQty(i.quantity):"",unitLabel(i.unit),i.item||i.raw_text,i.prep?`(${i.prep})`:""].filter(Boolean).join(" ")) });
      const now=state.recipes[id]; if(!now||this.hash(now)!==h) return; // changed while it was worked out: the next pass redoes it
      now.cost={...est, hash:h, at:new Date().toISOString()};
      store.enqueue("recipes",id,now); store.flush(); // quietly, without a "Saved" toast
      if(state.view==="timeline") renderTimeline(); else if(state.view==="detail"&&state.detailId===id) renderDetail();
    }catch(e){
      this.failed[id]=Date.now();
      if(e&&["no_api_key","ai_limit","ai_budget","bad_kind"].includes(e.code)) this.off=true; // no more today, or not on this server
    }finally{ this.busy=false; if(this.queue.length&&!this.off) setTimeout(()=>this.run(),800); }
  },
};
function costHtml(r){
  const c=r&&r.cost; if(!costOk(c)) return "";
  return `<div class="costline"><span>About <b>${esc(aud(c.home_per_serve))}</b> a serve to make · about <b>${esc(aud(outOf(c)))}</b> eating out</span>
    <small>Estimated${c.comparable?` against ${esc(c.comparable)}`:""} at a casual place, at Australian prices.</small></div>`;
}

/* ---------- guess a recipe from a photo of a dish (2.5) ----------
   Claude names the dish and writes a likely recipe, with how sure it is (0-100,
   shown as low / medium / high). It lands on the review form like any import,
   with the photo as the recipe's picture and the guess saved on the recipe. */
const guessLevel=n=>n>=75?"High":n>=45?"Medium":"Low";
function guessHtml(g,long){
  if(!g) return "";
  const n=Math.max(0,Math.min(100,Math.round(Number(g.confidence))||0)), lv=guessLevel(n);
  if(!long) return `<div class="source muted guessline ${lv.toLowerCase()}">Guessed from a photo · ${lv} confidence (${n}%)</div>`;
  const alts=(Array.isArray(g.alternatives)?g.alternatives:[]).filter(Boolean);
  return `<div class="guessnote ${lv.toLowerCase()}" role="note"><b>Guessed from a photo · ${lv} confidence (${n}%)</b>
    <span>Looks like ${esc(g.dish||"this dish")}${alts.length?`; it could also be ${esc(alts.join(", "))}`:""}.${g.basis?` ${esc(g.basis)}`:""} Check the ingredients and amounts before saving.</span></div>`;
}
async function guessFromPhoto(){
  closeSheet();
  if(!store.online){ toast("Guessing a recipe needs the server. Try again when you're back online."); return; }
  const files=(await pickPhotos()).slice(0,3); if(!files.length) return;
  const ctl=new AbortController();
  const sh=openSheet(`<h3>Looking at your dish</h3>
    <p class="status" id="guessStatus"><span class="spin"></span>Working out what it is and how to make it. This can take half a minute.</p>
    <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="stop">Stop</button></div>`);
  sheetActions(sh,{ stop:()=>{ ctl.abort(); closeSheet(); toast("Stopped. Nothing was added."); } });
  const mine=()=>sh.isConnected&&sh.classList.contains("open");
  const fail=msg=>{ if(!mine()) return toast(msg); sh.querySelector("h3").textContent="Couldn't guess that one"; const st=sh.querySelector("#guessStatus"); st.className="status err"; st.textContent=msg;
    sh.querySelector('[data-act="stop"]').textContent="Close"; sheetActions(sh,{ stop:closeSheet }); };
  try{
    const images=[]; for(const f of files) images.push(await forReading(f));
    const data=await store.ai("dish",{},images,ctl.signal);
    if(!data||data.error||!data.title){ fail("That doesn't look like a dish Bourdain can recognise. Try a closer photo of the food, from above."); return; }
    const ids=await uploadPhotos(files.slice(0,1)); // the photo becomes the recipe's picture
    state.draft={...normalise(data,""), source_type:"photo", photos:ids, guess:data.guess||null}; state.editingId=null; state.draftManual=true;
    if(mine()) closeSheet();
    if(state.view==="import") renderImport(); else show("import");
  }catch(e){ if(e&&e.name==="AbortError") return; console.warn("guess failed",e); fail(aiError(e,"reading that photo")); }
}

/* ---------- the owner's control room (2.4) ----------
   Hidden on purpose: a long press on the heading of the version sheet opens it,
   and only for the admin; the server refuses its data to anyone else. The first
   screen answers, in a few seconds: is anything wrong, is Bourdain healthy and
   used, what is AI costing, who's using it, what happened lately. Detail is one
   tap down: a person, AI usage and limits, all activity, the audit log, errors.
   Health shows only what the server can check; the rest says "Not monitored". */
const ACT_WORDS={ recipe_added:"added", recipe_edited:"edited", recipe_deleted:"deleted", cook_logged:"cooked", cook_added:"added a past cook of", recipe_copied:"copied",
  plan_changed:"changed the plan for", shop_changed:"changed the shopping list for", pantry_changed:"pantry:", pantry_removed:"took off the pantry:", profile_changed:"set their name to",
  ai_import:"imported a recipe with AI", ai_scan:"scanned the fridge", ai_ideas:"asked for recipe ideas", ai_write:"had a recipe written", ai_cover:"painted a cover", ai_dish:"guessed a recipe from a photo",
  signed_in:"signed in via", link_fetched:"fetched a link from" };
const AUDIT_WORDS={ limits_changed:"changed everyone's limits:", person_limits_changed:"changed limits for", cover_price_changed:"changed the cover price:",
  account_paused:"paused", account_resumed:"resumed", person_joined:"signed in for the first time:", deployed:"deployed", restarted:"restarted" };
const ACT_CATS=[["nosignin","All but sign-ins and links"],["content","Content"],["ai","AI"],["links","Link fetches"],["security","Sign-ins"],["all","Everything"]];
const KIND_NAMES={ import:"import", scan:"fridge scan", ideas:"recipe ideas", write:"recipe writing", cover:"cover", dish:"dish guess", cost:"cost estimate" };
const ACT_PERIODS=[["today","Today"],["7d","Last 7 days"],["30d","Last 30 days"],["all","All time"]];
const LIMIT_GROUPS=["import","scan","ideas","cover","cost"];
const LIMIT_NAMES={ import:"Imports", scan:"Fridge scans", ideas:"Ideas + write", cover:"Covers", cost:"Cost estimates" };
const fmtMB=b=>!b?"0 MB":b<10*1024*1024?`${Math.max(0.1,b/1024/1024).toFixed(1)} MB`:b<1024**3?`${Math.round(b/1024/1024)} MB`:`${(b/1024**3).toFixed(1)} GB`;
const usd=n=>!n?"US$0":n<0.01?"under US$0.01":"US$"+n.toFixed(2);
const plural=(n,one,many)=>`${n} ${n===1?one:(many||one+"s")}`;
const pct=(a,b)=>b>0?Math.round(100*a/b):0;
function whenShort(isoTs){
  if(!isoTs) return "never";
  const d=new Date(isoTs), t=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  return iso(d)===iso(new Date()) ? `today ${t}` : `${DAYS[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${t}`;
}
// A press held for ms calls fn. Attached to an element inside a sheet, it goes with that sheet (openSheet clones a fresh one).
function longPress(el,ms,fn){
  let h; const stop=()=>clearTimeout(h);
  el.addEventListener("pointerdown",()=>{ stop(); h=setTimeout(fn,ms); });
  ["pointerup","pointerleave","pointercancel"].forEach(t=>el.addEventListener(t,stop));
  el.addEventListener("contextmenu",e=>e.preventDefault());
}

  if(!store.me?.is_admin) return;

async function loadAdmin(){
  try{
    const [sum,act]=await Promise.all([ api("/api/admin/summary",{signal:timeout(15000)}), api("/api/admin/activity?limit=5&cat=nosignin",{signal:timeout(10000)}) ]);
    state.admin={sum,act,at:new Date().toISOString()};

// Lists a sub-screen needs: "audit", "errors", or "personAct" (one person's latest activity).
async function loadAdminList(kind){
  const url = kind==="audit" ? "/api/admin/audit?limit=100" : kind==="errors" ? "/api/admin/errors"
    : `/api/admin/activity?limit=10&cat=all&user=${encodeURIComponent(state.adminPersonId)}`;
  state["admin_"+kind]=null;
  try{ state["admin_"+kind]=await api(url,{signal:timeout(10000)}); }catch(e){ state["admin_"+kind]={error:e}; }
  if(state.view==="admin") renderAdmin();
}
function adminGo(screen, extra={}){
  Object.assign(state, extra); state.adminScreen=screen;
  renderAdmin(); toTop();
  if(screen==="activity") loadAdminActivity(true);
  if(screen==="audit") loadAdminList("audit");
  if(screen==="errors") loadAdminList("errors");

}

const ACT_PAGE=50;
async function loadAdminActivity(reset){
  const f=state.adminAct, seq=state.adminActSeq=(state.adminActSeq||0)+1;
  if(reset){ state.adminActRows=null; paintActivity(); }
  const day=n=>{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-n); return d.toISOString(); };
  const since={today:day(0),"7d":day(6),"30d":day(29)}[f.period]||"";
  const rows=Array.isArray(state.adminActRows)?state.adminActRows:[];
  const qs=new URLSearchParams({limit:ACT_PAGE, cat:f.cat}); if(f.who) qs.set("user",f.who); if(since) qs.set("since",since); if(f.q) qs.set("q",f.q); if(!reset&&rows.length) qs.set("before",rows[rows.length-1].id);
  try{ const got=await api("/api/admin/activity?"+qs,{signal:timeout(10000)}); if(seq!==state.adminActSeq) return; state.adminActRows=reset?got:[...rows,...got]; state.adminActMore=got.length===ACT_PAGE; }
  catch(e){ if(seq!==state.adminActSeq) return; state.adminActRows={error:e}; }
  paintActivity();
}
function paintActivity(){
  const el=document.getElementById("actList"); if(!el) return;
  const r=state.adminActRows;
  el.innerHTML=!r?`<p class="status"><span class="spin"></span>Loading…</p>`:r.error?`<p class="muted small">${esc(adminFail(r.error))}</p>`
    :r.length?r.map(actLine).join("")+(state.adminActMore?`<button class="adm-link wide" id="actMore">Show more</button>`:""):`<p class="muted small">Nothing matches.</p>`;
  const more=el.querySelector("#actMore"); if(more) more.onclick=()=>loadAdminActivity(false);
}
function renderAdmin(){

  const head=`<div class="detail-head"><button class="btn small ghost" id="aBack">${sub?"‹ Admin":"‹ Recipes"}</button>${!sub&&a&&!a.error?`<button class="btn small" id="aRefresh">Refresh</button>`:""}</div>`;
  const wire=()=>{
    el.querySelector("#aBack").onclick=()=>{ if(sub) adminGo(scr==="person"&&state.adminFromPeople?"people":"home",{adminFromPeople:false}); else show("recipes"); };
    const r=el.querySelector("#aRefresh"); if(r) r.onclick=()=>{ state.admin=null; renderAdmin(); };
  };
  if(!a){ el.innerHTML=head+`<div class="empty"><span class="spin"></span>Loading…</div>`; wire(); loadAdmin(); return; }
  if(a.error){ el.innerHTML=head+`<div class="empty">${esc(adminFail(a.error))}</div>`; wire(); return; }
  const screens={ home:adminHomeHtml, people:adminPeopleHtml, person:adminPersonHtml, ai:adminAiHtml, activity:adminActivityHtml, audit:adminAuditHtml, errors:adminErrorsHtml };
  el.innerHTML=head+(screens[scr]||adminHomeHtml)(a); wire();
  el.onclick=async e=>{
    const go=e.target.closest("[data-go]"); if(go){ adminGo(go.dataset.go); return; }
    const pp=e.target.closest("[data-person]"); if(pp){ adminGo("person",{adminPersonId:pp.dataset.person, adminFromPeople:scr==="people"}); return; }
    const lim=e.target.closest("[data-lim]"); if(lim){ personLimits(a.sum.people.find(p=>p.id===lim.dataset.lim),a.sum.defaults); return; }
    const act=e.target.closest("[data-admin]"); if(!act) return;
    const p=a.sum.people.find(x=>x.id===state.adminPersonId);
    if(act.dataset.admin==="invite") inviteSheet();
    if(act.dataset.admin==="export") exportData(act);
    if(act.dataset.admin==="theiract"){ state.adminAct={...state.adminAct, who:state.adminPersonId, cat:"all", period:"all", q:""}; adminGo("activity"); }
    if(act.dataset.admin==="reset"&&p){ if(await putLimits({user:p.id, overrides:null})){ toast(`${p.name||p.email} is back on everyone's limits`); loadAdmin(); } }
    if(act.dataset.admin==="pause"&&p) pauseSheet(p,true);
    if(act.dataset.admin==="resume"&&p) pauseSheet(p,false);
  };
  if(scr==="ai") el.querySelector("#limSave").onclick=saveDefaultLimits;
  if(scr==="activity"){
    const f=state.adminAct, set=(k,v)=>{ f[k]=v; loadAdminActivity(true); };
    el.querySelector("#actWho").onchange=e=>set("who",e.target.value);
    el.querySelector("#actCat").onchange=e=>set("cat",e.target.value);
    el.querySelector("#actPeriod").onchange=e=>set("period",e.target.value);
    let tm; el.querySelector("#actQ").oninput=e=>{ clearTimeout(tm); tm=setTimeout(()=>set("q",e.target.value.trim()),300); };
    paintActivity();
  }
}
// Pausing is reversible and deletes nothing, but it locks someone out, so it asks first.
function pauseSheet(p,pause){
  const who=esc(p.name||p.email);
  const sh=openSheet(pause
    ? `<h3>Pause ${who}'s account?</h3><p class="muted small" style="margin:0 0 12px">They won't be able to open Bourdain, and their recipes are hidden from everyone else until you resume it. Nothing is deleted.</p>
       <div class="row"><button class="btn danger" data-act="go">Pause account</button><button class="btn ghost" data-act="close">Cancel</button></div>`
    : `<h3>Resume ${who}'s account?</h3><p class="muted small" style="margin:0 0 12px">They can open Bourdain again, and their recipes are back for everyone.</p>
       <div class="row"><button class="btn" data-act="go">Resume account</button><button class="btn ghost" data-act="close">Cancel</button></div>`);
  sheetActions(sh,{ close:closeSheet, go:async b=>{
    b.disabled=true;
    try{ await api("/api/admin/people/"+encodeURIComponent(p.id),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({paused:pause}),signal:timeout(10000)});
      closeSheet(); toast(pause?`${p.name||p.email}'s account is paused`:`${p.name||p.email}'s account is back`); loadAdmin(); }
    catch(e){ b.disabled=false; toast(e.status?`The server didn't take that: ${e.message}.`:"Can't reach the server. Try again when you're back online."); }
  } });
}
function inviteSheet(){
  const sh=openSheet(`<h3>Invite someone</h3>
    <p class="muted small" style="margin:0 0 10px">Who can sign in is decided by Cloudflare, not Bourdain:</p>
    <ol class="small adm-steps"><li>Open <a href="https://one.dash.cloudflare.com/" target="_blank" rel="noopener">Cloudflare Zero Trust ↗</a> → Access → Applications → Bourdain → Policies.</li>
      <li>Add their email to the policy that lets people in.</li>
      <li>Send them the getting-started guide and the address.</li></ol>
    <p class="muted small">They appear here after their first sign-in, when Bourdain asks their name.</p>
    <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="close">Close</button></div>`);
  sheetActions(sh,{ close:closeSheet });
}
// Reads limit inputs from a container. Blank ones are left out when blankOk; returns null (and toasts) if one is wrong.
function readLimits(box,blankOk){
  const out={};
  for(const k of [...LIMIT_GROUPS,"monthly_usd","storage_mb"]){
    const v=box.querySelector("#lim_"+k).value.trim();
    if(v===""){ if(blankOk) continue; toast(`Fill in ${k==="monthly_usd"?"the monthly allowance":k==="storage_mb"?"the photo storage":LIMIT_NAMES[k].toLowerCase()}.`); return null; }
    const n=Number(v);
    if(k==="storage_mb"){ if(!(Number.isInteger(n)&&n>=0&&n<=100000)){ toast("Photo storage is a whole number of MB, up to 100000."); return null; } out[k]=n; continue; }
    if(k==="monthly_usd" ? !(n>=0&&n<=1000) : !(Number.isInteger(n)&&n>=0&&n<=1000)){ toast(k==="monthly_usd"?"The monthly allowance is US$0 to US$1000.":"Daily limits are whole numbers from 0 to 1000."); return null; }
    out[k]=n;
  }
  return out;
}
async function putLimits(body){
  try{ await api("/api/admin/limits",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:timeout(10000)}); return true; }
  catch(e){ toast(e.status?`The server didn't take that: ${e.message}.`:"Can't reach the server. Try again when you're back online."); return false; }
}
async function saveDefaultLimits(){
  const el=document.getElementById("view-admin"), lim=readLimits(el,false); if(!lim) return;
  const img=Number(el.querySelector("#lim_image_usd").value);
  if(!(img>=0&&img<=10)){ toast("The cover price is US$0 to US$10."); return; }
  lim.admin_exempt=el.querySelector("#lim_admin_exempt").checked;
  if(await putLimits({defaults:lim, image_usd:img})){ toast("Limits saved"); loadAdmin(); }
}
function personLimits(p,d){
  if(!p) return;
  const o=p.overrides||{};
  const f=(k,label,step=1)=>`<div class="field"><label for="lim_${k}">${label}</label><input class="input" id="lim_${k}" type="number" inputmode="decimal" min="0" step="${step}" placeholder="${esc(String(d[k]))}" value="${o[k]!=null?esc(String(o[k])):""}"></div>`;
  const sh=openSheet(`<h3>${esc(possessive(p.name||p.email))} limits</h3>
    <p class="muted small" style="margin:0 0 10px">Leave a box empty to use everyone's limit (shown in grey).${p.is_admin&&d.admin_exempt?" You have no limits while “No limits for you” is ticked.":""}</p>
    <div class="adm-lims">${LIMIT_GROUPS.map(g=>f(g,LIMIT_NAMES[g])).join("")}${f("monthly_usd","Monthly US$",0.5)}${f("storage_mb","Photos, MB",50)}</div>
    <div class="row"><button class="btn" data-act="save">Save</button><button class="btn ghost" data-act="reset">Use everyone's</button><button class="btn ghost" data-act="close">Close</button></div>`);
  sheetActions(sh,{ close:closeSheet,
    save:async()=>{ const lim=readLimits(sh,true); if(!lim) return; if(await putLimits({user:p.id, overrides:Object.keys(lim).length?lim:null})){ closeSheet(); toast("Limits saved"); loadAdmin(); } },
    reset:async()=>{ if(await putLimits({user:p.id, overrides:null})){ closeSheet(); toast(`${p.name||p.email} is back on everyone's limits`); loadAdmin(); } } });
}

/* ---------- version ---------- */
const metaOf=n=>{ const v=document.querySelector(`meta[name="${n}"]`)?.content||""; return v.startsWith("__")?"dev":v; };
const APP={ version:metaOf("app-version"), commit:metaOf("app-commit") };
document.getElementById("verLabel").textContent="v"+APP.version;
const isStale=info=>info && (info.version!==APP.version || (info.commit!=="dev" && APP.commit!=="dev" && info.commit!==APP.commit));
function fmtDate(isoDate){ const [y,m,d]=isoDate.split("-").map(Number); return `${d} ${MONTHS[m-1]} ${y}`; }
async function openVersion(){
  const sh=openSheet(`<h3 id="verHead" class="verhead">Bourdain ${esc(APP.version)}</h3><p class="muted small" style="margin:0 0 10px">Build ${esc(APP.commit)}</p>
    <div class="row verbtns"><button class="btn" data-act="profile">Edit profile</button><button class="btn" data-act="export">Export my data</button><button class="btn ghost" data-act="close">Close</button></div>
    <div id="verBody"><p class="status"><span class="spin"></span>Checking the server…</p></div>`);
  sheetActions(sh,{ close:closeSheet, export:exportData, profile:()=>profileSheet(false) });
  if(store.me?.is_admin) longPress(sh.querySelector("#verHead"),600,openAdmin); // the owner's screen: deliberately not a button
  let info=null; try{ info=await api("/api/version",{signal:timeout(10000)}); }catch(e){ console.warn("version check failed",e); }
  const body=sh.querySelector("#verBody"); if(!sh.isConnected||!body) return; // another sheet opened meanwhile
  if(!info){ body.innerHTML=`<p class="vernote">Couldn't reach the server, so I can't check for a newer version or show the history. Try again when you're back online.</p>`; return; }
  const note = isStale(info)
    ? `<p class="vernote stale">The server has <strong>${esc(info.version)}</strong> (build ${esc(info.commit)}), but this phone is still running ${esc(APP.version)}. Close the app fully and reopen it to update.</p>`
    : `<p class="vernote">Up to date with the server.</p>`;
  const hist=(info.changelog||[]).map(r=>`<div class="rel"><h4>${esc(r.version)}${r.version===APP.version?" · this phone":""}<span class="faint">${esc(fmtDate(r.date))}</span></h4>
    <ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`).join("");
  body.innerHTML = note + (hist?`<h3 style="font-family:var(--sans);font-size:13px;letter-spacing:.02em;text-transform:uppercase;margin:16px 0 4px">What's changed</h3>${hist}`:"");
}
document.getElementById("brand").onclick=openVersion;
/* One zip of everything this person owns: data.json plus the photos and covers
   their recipes use. A backup to keep, or for someone who asks for their data. */
async function exportData(btn){
  const old=btn.innerHTML; btn.disabled=true; btn.innerHTML=`<span class="spin"></span>Preparing…`;
  try{
    const res=await fetch(API+"/api/export",{redirect:"manual",signal:timeout(120000)});
    if(res.type==="opaqueredirect"||/text\/html/.test(res.headers.get("content-type")||"")) throw signin.error();
    if(!res.ok){ let e={}; try{ e=await res.json(); }catch(_){} throw Object.assign(new Error(e.error||res.statusText),{code:e.code,status:res.status}); }
    const name=(res.headers.get("Content-Disposition")||"").match(/filename="([^"]+)"/)?.[1]||"bourdain-export.zip";
    const url=URL.createObjectURL(await res.blob());
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    toast(`Saved ${name}. It has your recipes, plan, pantry and their photos.`);
  }catch(e){
    console.warn("export failed",e);
    toast(e.code==="signed_out" ? "You're signed out. Tap the red bar at the top to sign in again, then export." : e.status ? `The server couldn't make the export (${e.code||e.status}). Check the server logs.` : "Couldn't reach the server to make the export. Try again when you're back online.");
  }finally{ btn.disabled=false; btn.innerHTML=old; }
}
/* Quietly tell the user when the server has a newer build than the one this phone is running. */
async function checkForUpdate(){
  try{ const info=await api("/api/version",{signal:timeout(10000)}); if(isStale(info)) toast(`Version ${info.version} is ready. Close and reopen the app to update.`); }
  catch(e){ /* offline: nothing to compare against */ }
}

/* ---------- boot ---------- */
navigator.serviceWorker?.register?.("/sw.js").catch(()=>{});

(async()=>{
  await photoQueue.init(); // before the first render, so photos kept on this phone show
  store.loadLocal();
  drafts.restore(); // an import or edit left unsaved when the app was closed (2.7.4)
  show(state.view); // sets the header date as well as rendering
  await store.init();
  if(!(state.view==="import"&&state.draft)) render(); // don't wipe a form the user started while it loaded
  maybeWelcome();
  costs.sweep();
  timers.tick(); timers.run(); // a timer may have ended while the app was closed
  if(store.online) checkForUpdate();
})();
</script>
