document.getElementById("view-import").addEventListener("change",keepDraft);
document.getElementById("impBack").onclick=()=>show("recipes");

function blankRecipe(){ return {photos:[],title:"",description:"",source_url:"",source_type:"manual",servings:2,prep_min:null,cook_min:null,ingredients:[{raw_text:"",quantity:null,unit:"",item:"",prep:"",section:"",aisle:"other",optional:false}],steps:[""],tags:[]}; }

/* The parts of a recipe page that are the same whether it's yours or someone
   else's: source, description, tags, pictures; then ingredients with the batch
   scaler, method and notes. */
function recipeMediaHtml(r){
  return `${r.source_url?`<div class="source muted"><a href="${esc(webUrl(r.source_url))}" target="_blank" rel="noopener">${esc(hostOf(r.source_url)||r.source_url)}</a></div>`:""}
    ${guessHtml(r.guess,false)}
    ${r.description?`<p class="muted">${esc(r.description)}</p>`:""}
    ${costHtml(r)}
    <div class="tags" style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    ${r.cover?`<img class="hero cover" src="${coverUrl(r.cover)}" alt="">`:r.photos&&r.photos.length?`<img class="hero" src="${photoUrl(r.photos[0])}" alt="">`:""}
    ${r.cover ? (r.photos&&r.photos.length?photosHtml(r.photos,false):"") : (r.photos&&r.photos.length>1?photosHtml(r.photos.slice(1),false):"")}`;
}
function recipeMethodHtml(r){
  return `<h3>Ingredients</h3>
    <div class="scaler"><span class="lab">Batch</span>
      <span class="ctl"><button id="multDown" aria-label="Smaller batch">−</button><span class="amt" id="multAmt"></span><button id="multUp" aria-label="Bigger batch">+</button></span>
    </div>
    <ul class="ing" id="ingList"></ul>
    <h3>Method</h3><ol class="steps">${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    ${r.notes?`<h3>Notes</h3><p>${esc(r.notes)}</p>`:""}`;
}
function wireIngredients(el,r){
  const paintIng=()=>{
    const m=state.mult||1;
    let out="", lastSec=null;
    (r.ingredients||[]).forEach(i=>{
      if ((i.section||"")!==lastSec && i.section){ out+=`<li class="sec">${esc(i.section)}</li>`; }
      lastSec=i.section||"";
      const q=scaleQty(i.quantity,m);
      out+=`<li><span class="q ${m!==1&&q!=null?"scaled":""}">${esc(fmtQty(q))} ${esc(unitLabel(i.unit))}</span><span>${esc(i.item||i.raw_text)}${i.prep?`<span class="prep">, ${esc(i.prep)}</span>`:""}${i.optional?` <span class="faint">(optional)</span>`:""}</span></li>`;
    });
    el.querySelector("#ingList").innerHTML=out;
    const serves=r.servings?Math.round(r.servings*m*100)/100:null;
    el.querySelector("#multAmt").innerHTML=`${m}×${serves?`<small>${fmtQty(serves)} serves</small>`:""}`;
    el.querySelector("#multDown").disabled=m<=0.5;
    el.querySelector("#multUp").disabled=m>=10;
  };
  paintIng();
  el.querySelector("#multDown").onclick=()=>{ state.mult=Math.max(0.5,(state.mult||1)-0.5); paintIng(); };
  el.querySelector("#multUp").onclick=()=>{ state.mult=Math.min(10,(state.mult||1)+0.5); paintIng(); };
}
function renderDetail(){
  const r=state.recipes[state.detailId]; const el=document.getElementById("view-detail");
  if(!r){ el.innerHTML=`<div class="empty">Recipe not found.</div>`; return; }

  document.getElementById("view-theirs").innerHTML=""; // the two share element ids; only one is ever on the page

  el.innerHTML=`
    <div class="detail-head"><button class="btn small ghost" id="back">‹ ${state.detailFrom==="timeline"?"Archives":"Recipes"}</button>
      <div class="row"><button class="btn small" id="edit">Edit</button><button class="btn small danger" id="del">Delete</button></div></div>
    <h2>${esc(r.title)}</h2>
    <div class="meta">${esc(meta)}</div>
    ${from?`<button class="fromline" id="fromLine" data-owner="${esc(from.owner||"")}" data-rid="${esc(from.id||"")}">From ${esc(from.name||"someone")}'s recipes ›</button>`:""}
    <button class="cookstats" id="cookStats" aria-label="Rating and cooking history">${cookStatsHtml(r)}</button>
    ${recipeMediaHtml(r)}
    ${coversOf(r).length>1?`<button class="coverpick" id="pickCover">Choose from your ${coversOf(r).length} covers ›</button>`:""}
    <div class="actions quad"><button class="btn primary" id="cookThis">${cooking.get()?.recipeId===state.detailId?"Continue cooking":"Cook this"}</button><button class="btn" id="addPlan">Add to the week</button><button class="btn" id="addPhoto">Add photo</button><button class="btn" id="makeCover">${r.cover?"New cover":"Make cover"}</button></div>
    <p class="allow" data-allow="cover" hidden></p>
    ${recipeMethodHtml(r)}`;
  wireIngredients(el,r);
  const fl=el.querySelector("#fromLine"); if(fl) fl.onclick=()=>openTheirs(fl.dataset.owner,fl.dataset.rid,"detail");

  el.querySelector("#del").onclick=()=>{

      <div class="row" style="margin-top:12px"><button class="btn danger" data-act="yes">Delete recipe</button><button class="btn ghost" data-act="no">Keep it</button></div>`);
    sheetActions(sh,{ no:closeSheet, yes:async()=>{
      const id=state.detailId; closeSheet();
      delete state.recipes[id];
      let ok=true;
      for(const k of Object.keys(state.plan)){ const day=state.plan[k]; const before=day.entries.length; day.entries=day.entries.filter(e=>e.recipeId!==id); if(day.entries.length!==before) ok=await savePlanDay(k,day)&&ok; }
      ok=await store.del("recipes",id)&&ok;
      if(ok) toast("Deleted"); show("recipes");
    } });
  };
  el.querySelector("#addPlan").onclick=()=>pickDay(state.detailId);
  el.querySelector("#cookThis").onclick=()=>startCooking(state.detailId);
  el.querySelector("#cookStats").onclick=()=>historySheet(state.detailId);

  const ap=el.querySelector("#addPhoto"); if(ap) ap.onclick=async()=>{ const files=await pickPhotos(); if(!files.length) return; toast("Uploading…"); const ids=await uploadPhotos(files); if(!ids.length) return; r.photos=[...(r.photos||[]),...ids]; r.updated_at=new Date().toISOString(); await store.put("recipes",state.detailId,r); renderDetail(); };
}

/* ---------- other people (2.1) ----------
   Everyone in the group can browse everyone's recipes and cooks, but your own
   book only ever holds recipes you own. Someone else's recipe opens read-only
   with one action, Add to my recipes, which makes your own copy (its own
   rating and cook log, and "From Sam's recipes"). All of this needs the
   server; offline, those parts simply don't show. See docs/multi-user.md. */
const people={
  list:null, loading:null, at:0,
  load(force){
    if(this.loading) return this.loading;
    if(this.list&&!force) return Promise.resolve(this.list);
    this.loading=api("/api/people",{signal:timeout(10000)}).then(l=>(this.list=l)).catch(()=>this.list).finally(()=>{ this.at=Date.now(); this.loading=null; });
    return this.loading;
  },
  stale(){ return Date.now()-this.at>60000; }, // failures count too, so an unreachable server isn't asked on every render
  others(){ return (this.list||[]).filter(p=>!p.me); },
  byId(id){ return (this.list||[]).find(p=>p.id===id); },
};
// A person's photo, or their initial on grey. sizes: xs (18), sm (32), md (44), lg (72)
/* Profile pictures (2.5): an uploaded photo, one of the vegetable icons in
   /avatars ("veg:tomato"), or the person's initial on grey. Only names on this
   list become an image, since the value comes from other people's profiles. */
const VEG=["tomato","carrot","onion","garlic","broccoli","eggplant","capsicum","mushroom","potato","lemon","avocado","corn","chilli","ginger","basil","spring-onion","spinach","red-onion"];
const vegOf=photo=>{ const m=/^veg:([a-z-]+)$/.exec(String(photo||"")); return m&&VEG.includes(m[1])?m[1]:null; };
// Someone without a picture gets one of the vegetables (2.5.1), picked from their id so it's the
// same one on every phone and every visit. Nothing is stored; choosing a picture replaces it.
const defaultVeg=id=>id?VEG[parseInt(hashStr("veg:"+id),36)%VEG.length]:null;
function avatar(p,size="sm"){
  const initial=esc(((p&&p.name)||"?").trim()[0]||"?").toUpperCase(), veg=vegOf(p&&p.photo)||(p&&!p.photo?defaultVeg(p.id):null);
  if(veg) return `<span class="av ${size} veg"><img src="/avatars/${veg}.webp" alt=""></span>`;
  const src=p&&p.photo?photoUrl(p.photo):"";
  return src ? `<span class="av ${size}"><img src="${src}" alt=""></span>` : `<span class="av ${size}" aria-hidden="true">${initial}</span>`;
}
// The People row has room for a first name only; the profile shows the full one.
const firstName=n=>String(n||"").trim().split(/\s+/)[0]||"";
const possessive=n=>n?`${n}'s`:"Someone's";
// Is this someone else's recipe already copied into my book? Returns my copy's id.
const myCopyOf=(owner,id)=>Object.entries(state.recipes).find(([,r])=>r&&r.copied_from&&r.copied_from.owner===owner&&r.copied_from.id===id)?.[0]||null;

/* Search across everyone else's books, under your own results. Waits for a pause
   in typing, and quietly shows nothing if the server can't be reached. */
const others={
  timer:null, last:"",
  search(q){
    clearTimeout(this.timer);
    const el=document.getElementById("others");
    if(q.length<2){ this.last=""; el.innerHTML=""; return; }
    if(q===this.last) return; // same words: keep what's shown (a re-render after sync, say)
    this.timer=setTimeout(async()=>{
      let hits; try{ hits=await api("/api/search?q="+encodeURIComponent(q),{signal:timeout(10000)}); }catch(_){ hits=null; }
      if(state.query.trim().toLowerCase()!==q) return; // they've kept typing
      this.last=q;
      if(!hits||!hits.length){ el.innerHTML=""; return; }
      el.innerHTML=`<h3 class="tl-head others-head">In other people's books</h3><div class="rlist">${hits.map(h=>{
        const p={id:h.owner,name:h.name,photo:h.photo}, mine=h.copied||myCopyOf(h.owner,h.id);
        return cardHtml({title:h.title,cover:h.cover,photos:h.firstPhoto?[h.firstPhoto]:[],rating:h.rating,prep_min:h.prep_min,cook_min:h.cook_min,servings:h.servings},
          `data-owner="${esc(h.owner)}" data-rid="${esc(h.id)}"`,
          `<div class="owner">${avatar(p,"xs")}<span>${esc(possessive(h.name))}</span>${mine?`<span class="inyours">In your recipes</span>`:""}</div>`);
      }).join("")}</div>`;
    },300);
  },
};
document.getElementById("others").onclick=e=>{ const c=e.target.closest("[data-owner]"); if(c) openTheirs(c.dataset.owner,c.dataset.rid,"recipes"); };

/* Someone else's recipe, read-only. `from` is where Back goes. */
function openTheirs(owner,rid,from){
  if(store.me&&owner===store.me.id){ state.detailId=rid; show("detail"); return; }
  state.theirs={owner,rid,from,data:null,error:null}; state.mult=1;
  show("theirs");
  api(`/api/people/${encodeURIComponent(owner)}/recipes/${encodeURIComponent(rid)}`,{signal:timeout(10000)})
    .then(d=>{ if(state.theirs&&state.theirs.rid===rid){ state.theirs.data=d; if(state.view==="theirs") renderTheirs(); } })
    .catch(e=>{ if(state.theirs&&state.theirs.rid===rid){ state.theirs.error=e; if(state.view==="theirs") renderTheirs(); } });
}
function renderTheirs(){
  const el=document.getElementById("view-theirs"), t=state.theirs;
  if(!t){ show("recipes"); return; }
  const backTo={person:null,recipes:"Recipes",timeline:"Archives",detail:"Your copy"}[t.from];
  const who=t.data?.person||people.byId(t.owner);
  const back=`<div class="detail-head"><button class="btn small ghost" id="tBack">‹ ${esc(backTo||(who&&who.name)||"Back")}</button></div>`;
  if(!t.data){
    el.innerHTML=back+(t.error ? `<div class="empty">${t.error.status===404?"That recipe isn't there any more. Its owner may have deleted it.":"Can't reach the server to show this recipe. Try again when you're back online."}</div>`
      : `<div class="empty"><span class="spin"></span>Opening the recipe…</div>`);
  } else {
    document.getElementById("view-detail").innerHTML=""; // shares element ids with this view
    const r=t.data.recipe, mine=myCopyOf(t.owner,t.rid);
    const meta=[r.servings?`Serves ${r.servings}`:null, r.prep_min?`${r.prep_min} min prep`:null, r.cook_min?`${r.cook_min} min cook`:null].filter(Boolean).join(" · ");
    el.innerHTML=`${back}
      <h2>${esc(r.title||"Untitled")}</h2>
      <div class="meta">${esc(meta)}</div>
      <button class="fromline who" id="tWho">${avatar(who,"xs")}<span>${esc(possessive(who&&who.name))} recipe</span>${r.rating?`<span class="cstars">${stars(r.rating)}</span>`:""}</button>
      ${recipeMediaHtml(r)}
      <div class="actions"><button class="btn ${mine?"":"accent"} wide" id="tCopy">${mine?"In your recipes ›":"Add to my recipes"}</button></div>
      ${recipeMethodHtml(r)}`;
    wireIngredients(el,r);
    el.querySelector("#tWho").onclick=()=>openPerson(t.owner);
    el.querySelector("#tCopy").onclick=async e=>{
      const have=myCopyOf(t.owner,t.rid); if(have){ state.detailId=have; show("detail"); return; }
      const b=e.currentTarget; b.disabled=true; b.innerHTML=`<span class="spin"></span>Adding…`;
      try{
        const res=await api("/api/copy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({owner:t.owner,id:t.rid}),signal:timeout(15000)});
        state.recipes[res.id]=res.recipe; store.local();
        state.detailId=res.id; state.mult=1; show("detail");
        toast(res.already?"It's already in your recipes.":`Added to your recipes. Rate it and cook it as your own.`);
      }catch(err){
        b.disabled=false; b.textContent="Add to my recipes";
        toast(err.status===404?"That recipe isn't there any more. Its owner may have deleted it.":"Couldn't reach the server to add it. Try again when you're back online.");
      }
    };
  }
  el.querySelector("#tBack").onclick=()=>{
    if(t.from==="person") show("person"); else if(t.from==="detail") show("detail"); else show(t.from||"recipes");
  };
}

/* A person's profile: their recipes (read-only for anyone else) and recent cooks. */
// A profile remembers the tab it was opened from (Recipes, or Archives through a feed recipe), for Back.
function openPerson(id){ state.personFrom=document.querySelector("#tabs button.on")?.dataset.view||"recipes"; state.personId=id; state.person=null; show("person"); }
function renderPerson(){
  const el=document.getElementById("view-person"), id=state.personId;
  const cached=state.person&&state.person.person.id===id ? state.person : null;
  const p=cached?.person||people.byId(id);
  const head=`<div class="detail-head"><button class="btn small ghost" id="pBack">‹ ${state.personFrom==="timeline"?"Archives":"Recipes"}</button>${p&&p.me?`<button class="btn small" id="pEdit">Edit profile</button>`:""}</div>`;
  if(!cached){
    setHtml(el,head+`<div class="empty"><span class="spin"></span>Opening ${esc(possessive(p&&p.name))} recipes…</div>`);
    api("/api/people/"+encodeURIComponent(id),{signal:timeout(10000)})
      .then(d=>{ state.person=d; if(state.view==="person"&&state.personId===id) renderPerson(); })
      .catch(()=>{ if(state.view==="person"&&state.personId===id){ setHtml(el,head+`<div class="empty">Can't reach the server to show ${esc(possessive(p&&p.name))} recipes. Try again when you're back online.</div>`); wirePersonHead(); } });
    wirePersonHead(); return;
  }
  const rs=Object.entries(cached.recipes||{}).filter(([,r])=>r).sort((a,b)=>(a[1].title||"").localeCompare(b[1].title||""));
  const cooks=rs.flatMap(([rid,r])=>(r.cooks||[]).filter(c=>c&&c.date).map(c=>({rid,r,date:c.date,at:c.at||c.date}))).sort((a,b)=>(b.date+b.at).localeCompare(a.date+a.at));
  const me=cached.person.me;
  setHtml(el,`${head}
    <div class="profile">${avatar(cached.person,"lg")}<div><h2>${esc(cached.person.name)}</h2>
      <div class="meta">${rs.length} recipe${rs.length===1?"":"s"} · ${cooks.length} cook${cooks.length===1?"":"s"}</div></div></div>
    ${cooks.length?`<h3 class="tl-head">Recently cooked</h3><div class="tl-top">${cooks.slice(0,5).map(c=>{ const dt=new Date(c.date+"T00:00");
      return `<button class="slot" data-rid="${esc(c.rid)}">${miniThumb(c.r)}<span class="t">${esc(c.r.title||"Untitled")}<span class="tl-sub">${DAYS[(dt.getDay()+6)%7]} ${dt.getDate()} ${MONTHS[dt.getMonth()]}${c.r.rating?" · "+stars(c.r.rating):""}</span></span></button>`; }).join("")}</div>`:""}
    <h3 class="tl-head">${me?"Your recipes":esc(possessive(cached.person.name))+" recipes"}</h3>
    ${rs.length?`<div class="rlist">${rs.map(([rid,r],i)=>cardHtml(r,`data-rid="${esc(rid)}"`, !me&&myCopyOf(id,rid)?`<div class="owner"><span class="inyours">In your recipes</span></div>`:"",i>=FIRST_SCREEN)).join("")}</div>`
      :`<div class="empty">No recipes yet.</div>`}`);
  wirePersonHead();
  el.onclick=e=>{ const c=e.target.closest("[data-rid]"); if(!c) return; openTheirs(id,c.dataset.rid,"person"); };
}
function wirePersonHead(){
  const el=document.getElementById("view-person");
  el.querySelector("#pBack").onclick=()=>show(state.personFrom==="timeline"?"timeline":"recipes");
  const pe=el.querySelector("#pEdit"); if(pe) pe.onclick=()=>profileSheet(false);
}

/* Name and photo. Shown as a welcome the first time someone opens the app with no
   name yet (that includes the owner after updating to 2.1), and from the version
   sheet and your own profile after that. */
let welcomeShown=false;
function suggestName(email){ const w=String(email||"").split("@")[0].split(/[._+-]/)[0]; return w?w[0].toUpperCase()+w.slice(1):""; }

/* ---------- cooking ----------
   "Cook this" opens a checklist of the recipe's ingredients and steps. Progress is
   kept on this phone (localStorage), not the server, so ticking is instant and
   works offline, and it survives the phone locking or the app reloading. Only
   finishing writes to the recipe: a dated entry in `cooks` and, optionally, the
   Michelin-style `rating` (0–3). One cook at a time. */
const COOK_KEY="bourdain.cooking";
const cooking={
  get(){ try{ return JSON.parse(localStorage.getItem(COOK_KEY)||"null"); }catch(_){ return null; } },
  set(c){ try{ localStorage.setItem(COOK_KEY,JSON.stringify(c)); }catch(_){} },
  clear(){ try{ localStorage.removeItem(COOK_KEY); }catch(_){} if(typeof timers!=="undefined") timers.run(); },
};
const MICHELIN=[
  {n:0, label:"No stars", hint:"Fine, but nothing special"},
  {n:1, hint:"Very good cooking"},
  {n:2, hint:"Excellent, worth a detour"},
  {n:3, hint:"Exceptional, worth a special journey"},
];
/* Keeps the screen on while cooking, where supported. The browser drops the lock
   whenever the app is hidden, so it's re-requested on return. */
const wake={
  lock:null,
  async hold(){ try{ if(!this.lock && navigator.wakeLock) { this.lock=await navigator.wakeLock.request("screen"); this.lock.addEventListener?.("release",()=>{ this.lock=null; }); } }catch(e){ this.lock=null; } },
  release(){ try{ this.lock?.release(); }catch(_){} this.lock=null; },
};
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&state.view==="cook") wake.hold(); });

/* Michelin stars as the real six-petal mark (the #mstar symbol), in --flame. */
function stars(n){ n=Math.max(0,Math.min(3,Math.round(Number(n))||0)); // someone else's rating might be anything
  return n?`<span class="mstars" role="img" aria-label="${n} Michelin star${n===1?"":"s"}">${'<svg class="mstar"><use href="#mstar"/></svg>'.repeat(n)}</span>`:""; }

/* Sort and filter for the recipe list, remembered on this phone. */
const listPrefs={
  KEY:"bourdain.listPrefs",
  get(){
    let p; try{ p={sort:"new",filter:"all",view:"grid",...JSON.parse(localStorage.getItem(this.KEY)||"{}")}; }catch(_){ p={sort:"new",filter:"all",view:"grid"}; }
    if(!["grid","list"].includes(p.view)) p.view="grid";
    // a choice that's since been removed (like "30 minutes or less") falls back to the default
    const ok=(id,v)=>[...document.getElementById(id).options].some(o=>o.value===v);
    if(!ok("sortBy",p.sort)) p.sort="new"; if(!ok("filterBy",p.filter)) p.filter="all";
    return p;
  },
  set(p){ try{ localStorage.setItem(this.KEY,JSON.stringify(p)); }catch(_){} syncListCtl(); },
};
const totalMin=r=>(r.prep_min||0)+(r.cook_min||0);
const lastCooked=r=>{ const c=r.cooks||[]; return c.length?c[c.length-1].at||c[c.length-1].date:""; };
function keepRecipe(r,f){
  if(f==="s1") return (r.rating||0)>=1;
  if(f==="s2") return (r.rating||0)>=2;
  if(f==="s3") return r.rating===3;
  if(f==="unrated") return r.rating==null;
  if(f==="never") return !(r.cooks||[]).length;
  return true;
}
function sortRecipes(a,b,by){
  const title=(a.title||"").localeCompare(b.title||"");
  if(by==="az") return title;
  if(by==="stars") return (b.rating||0)-(a.rating||0) || (b.rating!=null)-(a.rating!=null) || title; // unrated after "no stars"
  if(by==="most") return (b.cooks||[]).length-(a.cooks||[]).length || title;
  if(by==="recent") return lastCooked(b).localeCompare(lastCooked(a)) || title;
  if(by==="quick") return (totalMin(a)||1e9)-(totalMin(b)||1e9) || title; // no time given goes last
  return (b.created_at||"").localeCompare(a.created_at||"");
}
function syncListCtl(){ const p=listPrefs.get(); document.getElementById("sortBy").value=p.sort; document.getElementById("filterBy").value=p.filter;
  document.body.classList.toggle("aslist",p.view==="list");
  const vt=document.getElementById("viewTog"), to=p.view==="list"?"grid":"list";
  vt.dataset.view=p.view; vt.dataset.as=to; vt.setAttribute("aria-label",to==="list"?"Show as a list":"Show as a grid"); }
document.getElementById("viewTog").onclick=e=>listPrefs.set({...listPrefs.get(),view:e.currentTarget.dataset.as});
document.getElementById("sortBy").onchange=e=>{ listPrefs.set({...listPrefs.get(),sort:e.target.value}); renderRecipes(); };
document.getElementById("filterBy").onchange=e=>{ listPrefs.set({...listPrefs.get(),filter:e.target.value}); renderRecipes(); };
syncListCtl();

/* ---------- cook timers ----------
   Durations in a step ("simmer for 20 minutes", "1 hour 30 minutes", "8-10 mins")
   become tap-to-start timers. A timer stores when it ends, not a countdown, so it
   stays right through reloads and the phone sleeping; it lives in the cook session.
   When one ends: a sheet, a vibration and three beeps. */
function parseDurations(text){
  const out=[], re=/(\d+(?:[.,]\d+)?\s*[½¼¾]?|[½¼¾])\s*(?:(?:-|–|to)\s*(\d+(?:[.,]\d+)?))?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b(?:\s*(?:and\s*)?(\d+)\s*(?:minutes?|mins?)\b)?/gi;
  const FR={"½":0.5,"¼":0.25,"¾":0.75};
  const num=x=>{ const t=String(x).trim(), f=FR[t.slice(-1)]||0, whole=f?t.slice(0,-1).trim():t; return (whole?Number(whole.replace(",",".")):0)+f; };
  let m; while((m=re.exec(text))){
    const unit=m[3].toLowerCase(), per=unit.startsWith("h")?3600:unit.startsWith("m")?60:1;
    let secs=Math.round(num(m[1])*per + (m[4]?Number(m[4])*60:0));
    if(!secs||secs>86400) continue;
    const label=m[0].replace(/\s+/g," ").trim().replace(/^(\d+(?:[.,]\d+)?)\s*(?:-|–|to)\s*/,"$1–");
    out.push({secs,label});
  }
  return out;
}
const fmtLeft=ms=>{ const t=Math.max(0,Math.ceil(ms/1000)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=t%60; return h?`${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`:`${m}:${String(sec).padStart(2,"0")}`; };
const timers={
  handle:null, audio:null,
  list(){ return (cooking.get()?.timers)||[]; },
  save(list){ const c=cooking.get(); if(!c) return; c.timers=list; cooking.set(c); this.paint(); this.run(); },
  start(id,label,secs){ this.unlock(); this.save([...this.list().filter(t=>t.id!==id), {id,label,secs,ends:Date.now()+secs*1000,done:false}]); },
  cancel(id){ this.save(this.list().filter(t=>t.id!==id)); },
  add(id,secs){ this.save(this.list().map(t=>t.id===id?{...t,ends:Math.max(t.ends,Date.now())+secs*1000,done:false}:t)); },
  unlock(){ try{ this.audio ||= new (window.AudioContext||window.webkitAudioContext)(); this.audio.resume?.(); }catch(_){} }, // must happen on a tap
  beep(){ try{ const a=this.audio; if(!a) return; for(let i=0;i<3;i++){ const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+i*0.45;
    o.frequency.value=880; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.4); } }catch(_){} },
  run(){ const live=this.list().some(t=>!t.done); if(live&&!this.handle) this.handle=setInterval(()=>this.tick(),1000); if(!live&&this.handle){ clearInterval(this.handle); this.handle=null; } },
  tick(){
    const list=this.list(); let rang=null;
    for(const t of list) if(!t.done && t.ends<=Date.now()){ t.done=true; rang=t; }
    if(rang){ this.save(list); this.alarm(rang); } else this.paint();
  },
  alarm(t){
    try{ navigator.vibrate?.([300,150,300,150,600]); }catch(_){}
    this.beep();
    const sh=openSheet(`<h3>Time's up</h3><p class="muted" style="margin:0 0 6px">${esc(t.label)}</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="ok">OK</button><button class="btn ghost" data-act="more">1 more minute</button></div>`);
    sheetActions(sh,{ ok:()=>{ closeSheet(); this.cancel(t.id); }, more:()=>{ closeSheet(); this.add(t.id,60); } });
  },
  chip(id,label,secs,shown=label){ // the button in a step (shows just the duration) and in the timer bar (full label)
    const t=this.list().find(x=>x.id===id);
    if(!t) return `<button class="tmr" data-tstart="${esc(id)}" data-secs="${secs}" data-label="${esc(label)}">⏱ ${esc(shown)}</button>`;
    if(t.done) return `<button class="tmr done" data-tdone="${esc(id)}">Done · ${esc(shown)}</button>`;
    return `<button class="tmr run" data-trun="${esc(id)}"><span data-left="${esc(id)}">${fmtLeft(t.ends-Date.now())}</span> · ${esc(shown)}</button>`;
  },
  paint(){
    document.querySelectorAll("[data-left]").forEach(el=>{ const t=this.list().find(x=>x.id===el.dataset.left); if(t) el.textContent=fmtLeft(t.ends-Date.now()); });
    const bar=document.getElementById("timerBar");
    if(bar && state.view==="cook") bar.innerHTML=this.list().map(t=>this.chip(t.id,t.label,t.secs)).join("");
    if(state.view==="cook") document.querySelectorAll(".tmrs[data-for]").forEach(box=>{ box.innerHTML=box.dataset.for.split("|").filter(Boolean).map(x=>{ const [id,secs,label,shown]=x.split("~"); return this.chip(id,label,+secs,shown); }).join(""); });
    const cb=document.getElementById("cookBanTimer"); if(cb){ const next=this.list().filter(t=>!t.done).sort((a,b)=>a.ends-b.ends)[0]; cb.textContent=next?` · ⏱ ${fmtLeft(next.ends-Date.now())}`:""; }
  },
  click(e){ // one handler for every timer button, wherever it is
    const st=e.target.closest("[data-tstart]"); if(st){ this.start(st.dataset.tstart,st.dataset.label,+st.dataset.secs); return true; }
    const dn=e.target.closest("[data-tdone]"); if(dn){ this.cancel(dn.dataset.tdone); return true; }
    const rn=e.target.closest("[data-trun]"); if(rn){ const t=this.list().find(x=>x.id===rn.dataset.trun); if(!t) return true;
      const sh=openSheet(`<h3>${esc(t.label)}</h3><p class="muted" style="margin:0 0 6px"><span data-left="${esc(t.id)}">${fmtLeft(t.ends-Date.now())}</span> left</p>
        <div class="row" style="margin-top:12px"><button class="btn" data-act="more">+1 minute</button><button class="btn danger" data-act="stop">Cancel timer</button><button class="btn ghost" data-act="keep">Keep going</button></div>`);
      sheetActions(sh,{ more:()=>{ this.add(t.id,60); closeSheet(); }, stop:()=>{ this.cancel(t.id); closeSheet(); }, keep:closeSheet });
      return true; }
    return false;
  },
};
// Browsers only allow sound after a tap, and forget that on reload: any tap while cooking re-enables the alarm beeps.
document.addEventListener("pointerdown",()=>{ if(cooking.get()) timers.unlock(); },{capture:true});
// Catch up after the phone slept or the app was reloaded mid-timer.
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") timers.tick(); });
function customTimerSheet(){
  const opts=[1,2,3,5,10,15,20,30,45,60];
  const sh=openSheet(`<h3>Start a timer</h3><div class="row" style="gap:8px;margin-top:6px">${opts.map(n=>`<button class="btn" data-act="go" data-n="${n}">${n} min</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn ghost" data-act="cancel">Cancel</button></div>`);
  sheetActions(sh,{ cancel:closeSheet, go:b=>{ const n=+b.dataset.n; closeSheet(); timers.start("c"+uid(),`${n} min timer`,n*60); } });
}

function cookStatsHtml(r){
  const n=(r.cooks||[]).length, last=n?r.cooks[n-1].date:null;
  const st=r.rating?stars(r.rating):(r.rating===0?"No stars":"Not rated yet");
  const times=n?`Cooked ${n===1?"once":n+" times"} · last ${fmtDate(last)}`:"Never cooked";
  return `${st} <span>·</span> <span>${esc(times)}</span>`;
}
function paintCookBanner(){
  const el=document.getElementById("cookBanner"); const c=cooking.get(); const r=c&&state.recipes[c.recipeId];
  if(!r){ el.innerHTML=""; return; }
  el.innerHTML=`<div class="cookbar"><span>Still cooking <strong>${esc(r.title)}</strong><span id="cookBanTimer"></span></span><button class="btn accent" id="cookResume">Continue</button></div>`;
  timers.paint(); timers.run();
  el.querySelector("#cookResume").onclick=()=>{ state.detailId=c.recipeId; show("cook"); };
}
function startCooking(recipeId){
  const cur=cooking.get(), curR=cur&&state.recipes[cur.recipeId];
  const begin=()=>{ cooking.set({recipeId, mult:state.mult||1, started:new Date().toISOString(), ing:[], steps:[], timers:[]}); timers.run(); state.detailId=recipeId; show("cook"); };
  if(cur && cur.recipeId===recipeId && curR){ show("cook"); return; } // carry on where you left off
  if(cur && curR){
    const sh=openSheet(`<h3>Still cooking ${esc(curR.title)}</h3><p class="muted small">Starting this one stops that cook without logging it.</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="switch">Start this one</button><button class="btn ghost" data-act="back">Back to ${esc(curR.title)}</button></div>`);
    sheetActions(sh,{ switch:()=>{ closeSheet(); begin(); }, back:()=>{ closeSheet(); state.detailId=cur.recipeId; show("cook"); } });
    return;
  }
  begin();
}
function renderCook(){
  const el=document.getElementById("view-cook"); const c=cooking.get(); const r=c&&state.recipes[c.recipeId];
  if(!r){ cooking.clear(); el.innerHTML=`<div class="empty">Nothing is cooking right now.</div>`; return; }
  wake.hold();
  const m=c.mult||1, steps=r.steps||[];
  const nextStep=steps.findIndex((_,i)=>!c.steps.includes(i));
  let ing="", lastSec=null;
  (r.ingredients||[]).forEach((i,ix)=>{
    if((i.section||"")!==lastSec && i.section) ing+=`<li class="sec">${esc(i.section)}</li>`;
    lastSec=i.section||"";
    const q=scaleQty(i.quantity,m), amount=[fmtQty(q), unitLabel(i.unit)].filter(Boolean).join(" ");
    ing+=`<li><button class="ck ${c.ing.includes(ix)?"done":""}" data-ing="${ix}"><span class="box"></span><span class="txt">${amount?`<span class="q">${esc(amount)}</span> `:""}${esc(i.item||i.raw_text)}${i.prep?`, ${esc(i.prep)}`:""}${i.optional?` <span class="faint">(optional)</span>`:""}</span></button></li>`;
  });
  el.innerHTML=`
    <div class="detail-head"><button class="btn small ghost" id="cookBack">‹ Recipe</button><span class="cookhead"><span class="kicker">Cooking${m!==1?` · ${m}× batch`:""}</span><button class="btn small" id="cookTimer">+ Timer</button></span></div>
    <h2>${esc(r.title)}</h2>
    <div class="meta" id="cookProgress"></div>
    <div class="timerbar" id="timerBar"></div>
    <h3>Ingredients</h3><ul class="cooklist" id="cookIng">${ing||`<li class="faint" style="padding:10px 0">No ingredients listed.</li>`}</ul>
    <h3>Method</h3><ol class="cooklist steps-ck" id="cookSteps">${steps.map((t,ix)=>`<li><button class="ck ${c.steps.includes(ix)?"done":""} ${ix===nextStep?"current":""}" data-step="${ix}"><span class="box"></span><span class="txt"><span class="n">Step ${ix+1}</span>${esc(t)}</span></button><div class="tmrs" data-for="${esc(parseDurations(t).map((d,k)=>`s${ix}-${k}~${d.secs}~Step ${ix+1} · ${d.label}~${d.label}`).join("|"))}"></div></li>`).join("")||`<li class="faint" style="padding:10px 0">No steps listed.</li>`}</ol>
    <div class="actions"><button class="btn primary" id="cookFinish">Finished cooking</button><button class="btn ghost" id="cookStop">Stop without saving</button></div>`;
  timers.paint(); timers.run();
  el.querySelector("#cookTimer").onclick=customTimerSheet;
  el.onclick=e=>{ timers.click(e); };
  const progress=()=>{ const cc=cooking.get(); el.querySelector("#cookProgress").textContent=`${cc.ing.length} of ${(r.ingredients||[]).length} ingredients · ${cc.steps.length} of ${steps.length} steps done`; };
  progress();
  // Toggle in place rather than re-rendering, so the page doesn't jump while you cook.
  const toggle=(key,ix,btn)=>{ const cc=cooking.get(); if(!cc) return; const list=cc[key]; const at=list.indexOf(ix);
    if(at>=0) list.splice(at,1); else list.push(ix); cooking.set(cc); btn.classList.toggle("done",at<0);
    if(key==="steps"){ const next=steps.findIndex((_,i)=>!cc.steps.includes(i)); el.querySelectorAll("[data-step]").forEach(b=>b.classList.toggle("current",+b.dataset.step===next)); }
    progress(); };
  el.querySelector("#cookIng").onclick=e=>{ const b=e.target.closest("[data-ing]"); if(b) toggle("ing",+b.dataset.ing,b); };
  el.querySelector("#cookSteps").onclick=e=>{ const b=e.target.closest("[data-step]"); if(b) toggle("steps",+b.dataset.step,b); };
  el.querySelector("#cookBack").onclick=()=>{ state.detailId=c.recipeId; show("detail"); };
  el.querySelector("#cookStop").onclick=()=>{
    const sh=openSheet(`<h3>Stop cooking?</h3><p class="muted small">Your ticks are cleared and this cook isn't logged.</p>
      <div class="row" style="margin-top:12px"><button class="btn danger" data-act="yes">Stop without saving</button><button class="btn ghost" data-act="no">Keep cooking</button></div>`);
    sheetActions(sh,{ no:closeSheet, yes:()=>{ closeSheet(); cooking.clear(); state.detailId=c.recipeId; show("detail"); toast("Stopped. Nothing was logged."); } });
  };

}
function ratingOpts(current){
  return `<div class="rate">${MICHELIN.map(o=>`<button class="opt ${current===o.n?"on":""}" data-act="rate" data-n="${o.n}">${o.n?stars(o.n):o.label}<small>${o.hint}</small></button>`).join("")}</div>`;
}
function finishSheet(recipeId){
  const r=state.recipes[recipeId]; if(!r) return;
  let picked=r.rating??null;
  const sh=openSheet(`<h3>How was it?</h3><p class="muted small" style="margin:0 0 6px">Rate ${esc(r.title)}, Michelin-style. You can skip this and rate it later.</p>
    ${ratingOpts(picked)}
    <div class="row" style="margin-top:14px"><button class="btn primary" data-act="save">Log this cook</button><button class="btn ghost" data-act="back">Keep cooking</button></div>`);
  sheetActions(sh,{
    rate:b=>{ picked=+b.dataset.n; sh.querySelectorAll('[data-act="rate"]').forEach(o=>o.classList.toggle("on",+o.dataset.n===picked)); },
    back:closeSheet,
    save:async()=>{
      closeSheet();
      const c=cooking.get(); const now=new Date();
      addCook(r,{date:iso(now), at:now.toISOString(), mult:(c&&c.recipeId===recipeId&&c.mult)||1});
      if(picked!==null) r.rating=picked;
      r.updated_at=now.toISOString();

    },
  });
}
/* Tap the stats line on a recipe: re-rate it, and see or correct the dates it was cooked. */
function historySheet(recipeId){
  const r=state.recipes[recipeId]; if(!r) return;
  const cooks=(r.cooks||[]).map((c,i)=>({...c,i})).reverse();
  const sh=openSheet(`<h3>${esc(r.title)}</h3><p class="muted small sheet-lead">Michelin rating</p>
    ${ratingOpts(r.rating??null)}
    <p class="muted small sheet-sub">${cooks.length?`Cooked ${cooks.length===1?"once":cooks.length+" times"}`:"Not cooked yet. Tap Cook this on the recipe to start, or add a time you've already made it."}</p>
    ${cooks.length?`<ul class="cooks">${cooks.map(c=>`<li><span>${esc(fmtDate(c.date))}${c.mult&&c.mult!==1?` · ${esc(c.mult)}× batch`:""}${c.added?` <span class="muted">· added later</span>`:""}</span><button class="x" data-act="rm" data-i="${c.i}" aria-label="Remove this date">×</button></li>`).join("")}</ul>`:""}
    <div class="row sheet-row"><button class="btn" data-act="add" id="addPastCook">Add a date I cooked this</button><button class="btn ghost" data-act="done">Done</button></div>`);
  const save=async msg=>{ r.updated_at=new Date().toISOString(); const ok=await store.put("recipes",recipeId,r); if(state.view==="detail") renderDetail(); if(ok&&msg) toast(msg); };
  sheetActions(sh,{
    done:closeSheet,
    add:()=>pastCookSheet(recipeId),
    rate:async b=>{ r.rating=+b.dataset.n; sh.querySelectorAll('[data-act="rate"]').forEach(o=>o.classList.toggle("on",+o.dataset.n===r.rating)); await save(r.rating?`Rated ${r.rating} Michelin star${r.rating===1?"":"s"}`:"Rated: no stars"); },
    // removing is instant; the toast's Undo puts it back (2.6.1)
    rm:async b=>{ const i=+b.dataset.i; const c=r.cooks[i]; r.cooks=r.cooks.filter((_,k)=>k!==i);
      r.updated_at=new Date().toISOString(); const ok=await store.put("recipes",recipeId,r); if(state.view==="detail") renderDetail(); historySheet(recipeId);
      if(ok) toast(`Removed ${fmtDate(c.date)}`,{label:"Undo",run:async()=>{
        const rr=state.recipes[recipeId]; if(!rr) return; addCook(rr,c); rr.updated_at=new Date().toISOString();
        const back=await store.put("recipes",recipeId,rr); if(state.view==="detail") renderDetail();
        if(document.querySelector("#sheet.open .cooks, #sheet.open #addPastCook")) historySheet(recipeId);
        if(back) toast(`Put back ${fmtDate(c.date)}`); }}); },
  });
}
/* A cook that happened without Cook this (2.6.0): any date up to today. It's marked
   `added`, so the server logs it as "cook added later" and the pilot's count of
   finished cooks stays honest; everywhere on the phone it counts like any other.
   Cooks are kept in date order, because "last cooked" reads the last one. */
const PAST_MULTS=[0.5,1,1.5,2,3,4];
function addCook(r,c){ r.cooks=[...(r.cooks||[]),c].sort((a,b)=>(a.date+(a.at||"")).localeCompare(b.date+(b.at||""))); }
function pastCookSheet(recipeId){
  const r=state.recipes[recipeId]; if(!r) return;
  const today=iso(new Date());
  const sh=openSheet(`<h3>When did you cook it?</h3><p class="muted small sheet-lead">${esc(r.title)}</p>
    <div class="field"><label for="pcDate">Date</label><input class="input" type="date" id="pcDate" max="${today}" value="${today}"></div>
    <div class="field"><label for="pcMult">Batch</label><select class="input" id="pcMult">${PAST_MULTS.map(m=>`<option value="${m}"${m===1?" selected":""}>${m===1?"1× (as written)":fmtQty(m)+"×"}</option>`).join("")}</select></div>
    <p class="status" id="pcStatus"></p>
    <div class="row sheet-row"><button class="btn primary" data-act="save">Add this cook</button><button class="btn ghost" data-act="back">Back</button></div>`);
  sheetActions(sh,{
    back:()=>historySheet(recipeId),
    save:async()=>{
      const date=sh.querySelector("#pcDate").value, mult=+sh.querySelector("#pcMult").value||1, st=sh.querySelector("#pcStatus");
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ st.className="status err"; st.textContent="Pick the date you cooked it."; return; }
      if(date>today){ st.className="status err"; st.textContent="That's in the future. Pick today or an earlier day."; return; }
      addCook(r,{date, at:new Date(date+"T12:00").toISOString(), mult, added:true});
      r.updated_at=new Date().toISOString();
      const ok=await store.put("recipes",recipeId,r);
      if(state.view==="detail") renderDetail();
      historySheet(recipeId);
      if(ok) toast(`Added ${fmtDate(date)}`);
    },
  });
}

/* ---------- plan ---------- */
function planDay(dateISO){ return state.plan[dateISO]||{date:dateISO,entries:[]}; }
async function savePlanDay(dateISO,day){ if(day.entries.length){ state.plan[dateISO]=day; return store.put("plan",dateISO,day); } delete state.plan[dateISO]; return store.put("plan",dateISO,{date:dateISO,entries:[]}); }

/* ---------- timeline ----------
   Every finished cook, newest first, read from each recipe's `cooks`. Nothing
   is stored for it. Each entry carries `who` so a shared feed can add other
   people's cooks later without changing how the page is built. */
const MONTHS_LONG=["January","February","March","April","May","June","July","August","September","October","November","December"];
// What a cook made, for the Archives: "8 servings" (the recipe's servings × the batch). A
// recipe without servings falls back to the batch size, and to nothing at 1×.
function cookServes(servings,mult){
  const s=Number(servings), m=Number(mult)>0?Number(mult):1;
  if(s>0){ const n=Math.round(s*m*100)/100; return `${fmtQty(n)} serving${n===1?"":"s"}`; }
  return m!==1?`${fmtQty(m)}× batch`:"";
}
// What your own cooks saved against eating out, this month and this year.
function savingsHtml(mine,ym,y){
  let month=0, year=0, counted=0, missing=0;
  for(const e of mine){ if(!e.date.startsWith(y)) continue; const r=state.recipes[e.recipeId], sv=r&&cookSaved(r.cost,r.servings,e.mult);
    if(sv==null){ missing++; continue; } counted++; year+=sv; if(e.date.startsWith(ym)) month+=sv; }
  if(!counted) return "";
  return `<p class="savings">Cooking at home saved you about <b>${esc(aud(month))}</b> this month and <b>${esc(aud(year))}</b> this year, against eating out.${missing?` <span class="faint">${missing} cook${missing===1?"":"s"} not estimated yet.</span>`:""}</p>`;
}
function timelineEntries(){
  const out=[];
  for(const [id,r] of Object.entries(state.recipes)) for(const c of (r.cooks||[])) if(c&&c.date) out.push({recipeId:id, date:c.date, at:c.at||c.date, mult:c.mult||1, who:"me"});
  return out.sort((a,b)=>b.date.localeCompare(a.date)||String(b.at).localeCompare(String(a.at)));
}
/* Everyone's cooks come from the server (/api/feed), refreshed when older than a
   minute. Yours always come from this phone's copy, so they're current and work
   offline. "Everyone" or "Just me" is remembered per phone. */
const WHO_KEY="bourdain.archivesWho";
const feed={
  entries:null, at:0, failed:false, loading:null,
  load(){
    if(this.loading) return this.loading;
    this.loading=api("/api/feed",{signal:timeout(10000)})
      .then(d=>{ this.entries=d.entries||[]; this.failed=false; })
      .catch(()=>{ this.failed=true; })
      .finally(()=>{ this.at=Date.now(); this.loading=null; });
    return this.loading;
  },
  stale(){ return Date.now()-this.at>60000; },
};
const archivesWho={ get(){ try{ return localStorage.getItem(WHO_KEY)==="me"?"me":"everyone"; }catch(_){ return "everyone"; } }, set(v){ try{ localStorage.setItem(WHO_KEY,v); }catch(_){} } };
function renderTimeline(){

    .sort((a,b)=>b.date.localeCompare(a.date)||String(b.at).localeCompare(String(a.at)));

  const top=Object.entries(count).filter(([,n])=>n>1).sort((a,b)=>b[1]-a[1]||lastCooked(state.recipes[b[0]]).localeCompare(lastCooked(state.recipes[a[0]]))).slice(0,3);

    if(e.mine){ const r=state.recipes[e.recipeId];

function timelineClick(e){

function slotSheet(k,ix){

  const r=state.recipes[en.recipeId]; const d=new Date(k+"T00:00");
  const sh=openSheet(`<h3>${esc(r?r.title:"(deleted recipe)")}</h3><p class="muted small">${DAYS[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()]}</p>

  const bump=async n=>{ en.servings=Math.max(1,en.servings+n); sh.querySelector("#svN").textContent=en.servings; await savePlanDay(k,day); renderPlan(); };
  sheetActions(sh,{

    cook:()=>{ closeSheet(); const r2=state.recipes[en.recipeId]; state.detailId=en.recipeId; state.mult=r2&&r2.servings?Math.max(0.5,Math.round(en.servings/r2.servings*2)/2):1; startCooking(en.recipeId); },

/* sheets */
function openSheet(html){
  const old=document.getElementById("sheet"); const s=old.cloneNode(false); // drops every handler attached to the previous sheet
  old.replaceWith(s); s.innerHTML=html; s.classList.add("open"); document.getElementById("sheetBg").classList.add("open");
  document.documentElement.classList.add("sheet-open"); // the page behind a sheet stays put
  document.getElementById("toast").classList.remove("show"); // a leftover toast would sit on top of the sheet
  s.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b||!s._acts) return; const fn=s._acts[b.dataset.act]; if(fn) fn(b,e); });
  nav.sync();

function sheetActions(s,acts){ s._acts=acts; }
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); document.getElementById("sheetBg").classList.remove("open"); document.documentElement.classList.remove("sheet-open"); nav.sync(); }
document.getElementById("sheetBg").onclick=closeSheet;

/* A recipe is on a day at most once (2.6.5): its serves are changed on the meal
   itself. Adding it again says so. Days that already have it twice (from before)
   are merged when the Plan shows them, keeping the larger serves. */
const dayLabel=k=>{ const d=new Date(k+"T00:00"); return `${DAYS[(d.getDay()+6)%7]} ${d.getDate()}`; };
const onDay=(k,rid)=>planDay(k).entries.some(e=>e.recipeId===rid);
const alreadyMsg=k=>`Already on ${dayLabel(k)}. Tap it on the Plan to change the serves.`;
function mergeDay(day){
  const seen=new Map(); let merged=false;
  for(const e of day.entries){ const had=seen.get(e.recipeId); if(had){ had.servings=Math.max(had.servings||0,e.servings||0)||had.servings; merged=true; } else seen.set(e.recipeId,{...e}); }
  return merged ? {...day, entries:[...seen.values()]} : null;
}
function pickRecipe(dateISO){
  const list=Object.entries(state.recipes).sort((a,b)=>(a[1].title||"").localeCompare(b[1].title||""));
  if(!list.length){ toast("No recipes yet"); return; }
  const s=openSheet(`<h3>Add to ${DAYS[(new Date(dateISO+"T00:00").getDay()+6)%7]} ${new Date(dateISO+"T00:00").getDate()}</h3>
    <input class="input" id="pickQ" placeholder="Search" style="margin-bottom:8px">

function pickDay(recipeId){

/* ---------- shopping list (the Shop tab, 2.7.0) ----------
   Built from the Plan for the week shown (the same week as the Plan; from today on
   for this week), grouped by aisle, each item saying which recipes it's for. The
   `shop` doc for the week keeps only what's yours: `checked` (items you ticked),
   `need` (pantry items you unticked to buy) and `manual` (things you added). */
const MASS={g:1,kg:1000}, VOL={ml:1,l:1000,tsp:5,tbsp:15,cup:250};
function family(u){ u=(u||"").toLowerCase(); if(MASS[u])return "mass"; if(VOL[u])return "vol"; return "count:"+(u||"whole"); }
function toBase(q,u){ u=(u||"").toLowerCase(); if(MASS[u])return q*MASS[u]; if(VOL[u])return q*VOL[u]; return q; }
function fromBase(q,fam){ if(fam==="mass") return q>=1000?[+(q/1000).toFixed(2),"kg"]:[Math.round(q),"g"]; if(fam==="vol") return q>=1000?[+(q/1000).toFixed(2),"l"]:[Math.round(q),"ml"]; const u=fam.slice(6); return [+q.toFixed(2), u==="whole"?"":u]; }
// The days the list is for: this week from today on, any other week in full.
function shopDays(){ const today=iso(new Date()); return [0,1,2,3,4,5,6].map(i=>iso(addDays(state.week,i))).filter(k=>iso(state.week)!==iso(mondayOf(new Date()))||k>=today); }

function buildList(days=shopDays()){
  const items={};
  for(const k of days){
    planDay(k).entries.forEach(e=>{
      const r=state.recipes[e.recipeId]; if(!r) return;
      const f = r.servings? e.servings/r.servings : 1;
      (r.ingredients||[]).forEach(ing=>{
        const item=String(ing.item||ing.raw_text||"").trim().toLowerCase(); if(!item) return;
        const fam=family(ing.unit); const key=item+"|"+fam;
        const q = ing.quantity==null||ing.quantity===""? null : Number(ing.quantity)*f;
        if(!items[key]) items[key]={key,item,fam,qty:0,own:0,units:new Set(),unknown:false,aisle:ing.aisle||"other",from:new Set(),optional:!!ing.optional};
        const it=items[key];
        if(q==null||!isFinite(q)) it.unknown=true; else { it.qty+=toBase(q,ing.unit); it.own+=q; it.units.add(String(ing.unit||"").toLowerCase()); }
        it.from.add(r.title||"Untitled"); if(!ing.optional) it.optional=false;
      });
    });
  }
  return Object.values(items);
}
// The amount to show: in the recipe's own unit when every recipe uses the same one
// (3 tbsp stays 3 tbsp), else added up in g/kg or ml/L.
function shopAmount(it){
  if(it.unknown&&!it.qty) return "";
  const [q,u]=it.units.size===1?[Math.round(it.own*100)/100,[...it.units][0]]:fromBase(it.qty,it.fam);
  return `${fmtQty(q)}${unitLabel(u)?" "+unitLabel(u):""}`;
}
function shopWeek(){ const k=iso(state.week); const sw=state.shop[k]||(state.shop[k]={week:k}); sw.checked=sw.checked||{}; sw.need=sw.need||{}; sw.manual=Array.isArray(sw.manual)?sw.manual:[]; return sw; }
async function saveShop(){ const k=iso(state.week); await store.put("shop",k,state.shop[k]); }
// Everything on the list for the week shown, with what's ticked and why.
function shopRows(){
  const sw=shopWeek(), have=new Set(Object.values(state.pantry).map(p=>itemKey(p&&p.item)));
  return [...buildList().map(it=>{ const pantry=have.has(itemKey(it.item));
      return {key:it.key,label:shopAmount(it),item:it.item,aisle:it.aisle,from:[...it.from].join(", "),optional:it.optional,manual:false,pantry,
        done:pantry?!sw.need[it.key]:!!sw.checked[it.key]}; }),
    ...sw.manual.map(m=>({key:"m:"+m.id,label:m.qty?`${fmtQty(m.qty)}${unitLabel(m.unit)?" "+unitLabel(m.unit):""}`:"",item:String(m.item||""),aisle:m.aisle||"other",from:"",manual:true,id:m.id,done:!!sw.checked["m:"+m.id]}))];
}

function renderShop(){
  const now=iso(state.week)===iso(mondayOf(new Date()));
  document.getElementById("shopWeekTitle").textContent=weekLabel(state.week);
  document.querySelector("#view-shop .weeknav").classList.toggle("current",now);
  const sw=shopWeek(), rows=shopRows(), el=document.getElementById("shopList");
  if(!rows.length){ setHtml(el,`<div class="empty"><h3>Nothing to buy yet</h3>${now&&shopDays().length<7?"Plan meals for the rest of this week":"Plan some meals for this week"} and the list builds itself. You can also add things below.</div>`); return; }
  const groups={}; rows.forEach(r=>{ (groups[r.aisle]=groups[r.aisle]||[]).push(r); });
  const order=[...AISLES,...Object.keys(groups).filter(a=>!AISLES.includes(a))];
  setHtml(el,order.filter(a=>groups[a]).map(a=>`<div class="aisle"><h3>${esc(a[0].toUpperCase()+a.slice(1))}</h3>${groups[a].sort((x,y)=>x.item.localeCompare(y.item)).map(r=>
    `<label class="item ${r.done?"done":""}"><input type="checkbox" data-key="${esc(r.key)}" ${r.pantry?"data-pantry":""} ${r.done?"checked":""}>
      <span class="lbl">${r.label?`<span class="q">${esc(r.label)}</span> `:""}${esc(r.item)}${r.optional?` <span class="faint">(optional)</span>`:""}${r.pantry?`<span class="ptag">from pantry</span>`:""}${r.from?`<div class="from">${esc(r.from)}</div>`:""}</span>
      ${r.manual?`<button class="x" data-rmm="${esc(r.id)}" aria-label="Remove ${esc(r.item)}">×</button>`:""}</label>`).join("")}</div>`).join(""));
  el.onchange=async e=>{ const c=e.target.closest("input[type=checkbox]"); if(!c) return; const sw=shopWeek(), k=c.dataset.key;
    if(c.hasAttribute("data-pantry")){ if(c.checked) delete sw.need[k]; else sw.need[k]=true; } // unticking a pantry item puts it back on the list
    else if(c.checked) sw.checked[k]=true; else delete sw.checked[k];
    c.closest(".item").classList.toggle("done",c.checked); await saveShop(); };
  el.onclick=async e=>{ const b=e.target.closest("[data-rmm]"); if(!b) return; e.preventDefault(); const sw=shopWeek(); sw.manual=sw.manual.filter(m=>m.id!==b.dataset.rmm); delete sw.checked["m:"+b.dataset.rmm]; await saveShop(); renderShop(); };
}
// Clear ticked: only what you ticked yourself. Pantry items stay ticked.
document.getElementById("clearChecked").onclick=async()=>{

// What's left to buy, as plain text: by aisle, without what's ticked or in the pantry.
function shopText(){

async function addManualItem(){
  const inp=document.getElementById("manualItem"); const t=inp.value.trim(); if(!t) return;
  const m=t.match(/^(\d+(?:\.\d+)?|½|¼|¾)\s*(g|kg|ml|l|tsp|tbsp|cups?|cans?|bunch|packets?)?\s+(.+)$/i);

/* ---------- pantry ---------- */
const AISLE_HINTS=[[/lettuce|tomato|onion|garlic|carrot|potato|herb|parsley|coriander|basil|lemon|lime|apple|banana|spinach|capsicum|pepper\b|cucumber|mushroom|ginger|chilli|chili|broccoli|zucchini|avocado|celery|cabbage|leek|spring onion|kale|corn/i,"produce"],
[/chicken|beef|pork|lamb|mince|steak|bacon|sausage|prawn|shrimp|salmon|tuna|fish|thigh|breast/i,"meat & seafood"],
[/milk|cream|butter|cheese|yog|yoghurt|yogurt|egg|feta|parmesan|halloumi/i,"dairy & eggs"],
[/bread|bun|roll|tortilla|wrap|pita|bagel|sourdough/i,"bakery"],
[/rice|pasta|noodle|flour|sugar|oil|vinegar|sauce|soy|stock|tin|can|bean|lentil|chickpea|honey|oat|coconut|tomato paste|cornflour|cornstarch|breadcrumb|peanut|tahini/i,"pantry"],
[/salt|cumin|paprika|cinnamon|turmeric|oregano|thyme|curry powder|spice|peppercorn|bay leaf/i,"spices"],
[/frozen|peas|ice/i,"frozen"]];
function guessAisle(item){ for(const [re,a] of AISLE_HINTS) if(re.test(item)) return a; return "other"; }
function parseItem(t){
  const m=t.match(/^(\d+(?:\.\d+)?|½|¼|¾)\s*(g|kg|ml|l|tsp|tbsp|cups?|cans?|bunch|packets?|cloves?|slices?)?\s+(.+)$/i);
  const fr={"½":.5,"¼":.25,"¾":.75};
  const item=(m?m[3]:t).trim().toLowerCase();
  return {id:uid(), qty:m?(fr[m[1]]??Number(m[1])):null, unit:m&&m[2]?m[2].toLowerCase().replace(/s$/,""):"", item, aisle:guessAisle(item), added:new Date().toISOString()};
}
async function pantryAdd(){

  const parts=raw.split(",").map(x=>x.trim()).filter(Boolean);

    <label class="item"><span class="lbl">${i.qty?`<span class="q">${esc(fmtQty(i.qty))}${unitLabel(i.unit)?" "+esc(unitLabel(i.unit)):""}</span> `:""}${esc(i.item)}</span>
    <button class="x" data-rmp="${i.id}" aria-label="Remove">×</button></label>`).join("")}</div>`).join("");
  el.onclick=async e=>{ const b=e.target.closest("[data-rmp]"); if(!b) return; e.preventDefault(); const id=b.dataset.rmp; delete state.pantry[id]; await store.del("pantry",id); renderPantry(); };

/* ---------- scan the fridge / pantry ----------
   Photos go to Claude (same route as screenshot imports), which lists what it can
   see. Nothing is added until the user ticks it off in a review list, the same rule
   as imports: everything is pre-ticked except items Claude isn't sure of. Items
   already in the pantry are listed but never added twice. */
const SCAN_MAX=6;
// The prompt for a scan lives in server.js (SCAN_PROMPT); only the photos go from here.
const itemKey=t=>String(t||"").toLowerCase().trim().replace(/ies$/,"y").replace(/oes$/,"o").replace(/([^s])s$/,"$1");
function tidyScan(out){
  const seen=new Set(), items=[];
  for(const x of (out&&Array.isArray(out.items)?out.items:[])){
    const item=String(x&&x.item||"").toLowerCase().trim(); if(!item||seen.has(itemKey(item))) continue; seen.add(itemKey(item));
    const q=Number(x.qty); items.push({ item, qty:x.qty!=null&&isFinite(q)&&q>0?q:null, unit:typeof x.unit==="string"?x.unit.toLowerCase().trim():"",
      aisle:AISLES.includes(x.aisle)?x.aisle:guessAisle(item), sure:x.sure!==false });
  }
  return items;
}
async function scanPantry(){
  if(!store.online){ toast("Scanning needs the server. Try again when you're back online."); return; }
  let files=(await pickPhotos()).filter(f=>f.type.startsWith("image/")); if(!files.length) return;
  if(files.length>SCAN_MAX){ files=files.slice(0,SCAN_MAX); toast(`Using the first ${SCAN_MAX} photos.`); }
  const ctl=new AbortController();
  const sh=openSheet(`<h3>Scanning</h3><p class="status" id="scanStatus"><span class="spin"></span>Looking for food in ${files.length} photo${files.length===1?"":"s"}…</p>
    <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="stop">Stop</button></div>`);
  sheetActions(sh,{ stop:()=>{ ctl.abort(); closeSheet(); toast("Stopped. Nothing was added."); } });
  const mine=()=>sh.isConnected&&sh.classList.contains("open");
  const fail=msg=>{ if(!mine()) return toast(msg); sh.querySelector("h3").textContent="Couldn't scan that";
    const st=sh.querySelector("#scanStatus"); st.className="status err"; st.textContent=msg;
    sh.querySelector('[data-act="stop"]').textContent="Close"; sheetActions(sh,{ stop:closeSheet }); };
  let items;
  try{
    const images=[]; for(const f of files) images.push(await forReading(f));
    items=tidyScan(await store.ai("scan", {}, images, ctl.signal));
  }catch(e){ if(e&&e.name==="AbortError") return; console.warn("scan failed",e); return fail(aiError(e,"scanning those photos")); }
  if(!mine()){ toast("The scan finished after it was closed, so nothing was added."); return; }
  if(!items.length) return fail("Couldn't spot any food in those photos. Try closer photos with the fridge light on.");
  const have=new Set(Object.values(state.pantry).map(p=>itemKey(p.item)));
  const fresh=items.filter(i=>!have.has(itemKey(i.item))), already=items.filter(i=>have.has(itemKey(i.item)));
  if(!fresh.length) return fail(`Everything in those photos is already on your list: ${already.map(i=>i.item).join(", ")}.`);
  const label=()=>{ const n=sh.querySelectorAll("input[data-ix]:checked").length; const b=sh.querySelector('[data-act="add"]'); b.textContent=n?`Add ${n} item${n===1?"":"s"}`:"Nothing ticked"; b.disabled=!n; };
  sh.innerHTML=`<h3>Found ${fresh.length} item${fresh.length===1?"":"s"}</h3>
    <p class="muted small" style="margin:0 0 6px">Untick anything that's wrong. Items marked "not sure" start unticked.</p>
    <div class="scanlist">${fresh.map((i,ix)=>`<label class="item"><input type="checkbox" data-act="tick" data-ix="${ix}" ${i.sure?"checked":""}>
      <span class="lbl">${i.qty?`<span class="q">${esc(fmtQty(i.qty))}${unitLabel(i.unit)?" "+esc(unitLabel(i.unit)):""}</span> `:""}${esc(i.item)}${i.sure?"":` <span class="tag">not sure</span>`}<small>${esc(i.aisle)}</small></span></label>`).join("")}
    ${already.length?`<p class="have">Already on your list: ${esc(already.map(i=>i.item).join(", "))}</p>`:""}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" data-act="add"></button><button class="btn ghost" data-act="cancel">Cancel</button></div>`;
  label();
  sheetActions(sh,{ tick:label, cancel:closeSheet, add:async()=>{
    const picked=[...sh.querySelectorAll("input[data-ix]:checked")].map(c=>fresh[+c.dataset.ix]); closeSheet();
    let ok=true;
    for(const i of picked){ const e={id:uid(), qty:i.qty, unit:i.unit, item:i.item, aisle:i.aisle, added:new Date().toISOString()};
      state.pantry[e.id]=e; ok=await store.put("pantry",e.id,e)&&ok; }
    renderPantry(); if(ok) toast(`Added ${picked.length} item${picked.length===1?"":"s"} to the pantry`);
  } });
}

/* ---------- AI error messages ----------
   One place that turns a server error code into something specific to do next.
   Codes come from callClaude / paintCover in server.js.                      */
function aiError(e, what="reading that"){
  const c=e&&e.code, d=e&&e.detail?` (${e.detail})`:"";
  const m={
    no_api_key:"No Anthropic API key is set on the server. Add ANTHROPIC_API_KEY to the TrueNAS app and redeploy.",
    bad_api_key:"The server's Anthropic API key was rejected. Check ANTHROPIC_API_KEY in the TrueNAS app.",
    no_credit:"The Anthropic account is out of credit. Top it up at console.anthropic.com, then try again.",
    model_unavailable:`The Claude model set on the server isn't available${d}. Change CLAUDE_MODEL in the TrueNAS app.`,
    rate_limited:"Too many requests right now. Give it a minute and try again.",
    overloaded:"Claude is overloaded right now. Try again in a few minutes.",
    upstream_timeout:"Claude took too long to answer. Try again, or send less at once.",
    upstream_unreachable:"The server couldn't reach Claude. Check the NAS is online, then try again.",
    image_rejected:`Claude couldn't accept one of the images${d}. Remove it or use a different screenshot.`,
    upstream_rejected:`Claude rejected the request${d}.`,
    too_large:"That's too much to send at once. Use fewer screenshots, or paste just the recipe part.",
    truncated:"That was too long to finish in one reply. Paste just the recipe part, or use fewer screenshots.",
    refused:"Claude declined that one. Try different text or screenshots.",
    invalid_json:"The reply wasn't clean JSON. Try again, it usually works the second time.",
    no_image_key:"Covers need an OpenAI API key. Add OPENAI_API_KEY to the TrueNAS app and redeploy.",
    bad_image_key:"The server's OpenAI API key was rejected. Check OPENAI_API_KEY in the TrueNAS app.",
    no_image_credit:"The OpenAI account is out of credit or quota. Check billing at platform.openai.com.",
    image_rate_limited:"OpenAI is limiting requests right now. Try again in a minute.",
    image_refused:`The image model declined that prompt${d}. Try again, or the cover style may need rewording.`,
    image_request_rejected:`OpenAI rejected the request${d}.`,
    image_timeout:"The image took too long to paint. Try again.",
    image_unreachable:"The server couldn't reach OpenAI. Check the NAS is online, then try again.",
    image_failed:"The image model didn't send a picture back. Try again.",
    image_upstream_error:"OpenAI had a problem. Try again in a few minutes.",
    ai_busy:"Still working on your last one. Give it a moment to finish.",
    signed_out:"You're signed out. Tap the red bar at the top to sign in again.",
    not_trusted:untrustedMsg(e&&e.seen),
    unknown_host:unknownHostMsg(e&&e.seen),
    account_disabled:PAUSED_MSG,
    cross_site:"That change came from another website, so it wasn't made. Make it in Bourdain itself.",
    signin_unavailable:"The server can't check your sign-in right now (it can't reach Cloudflare). Try again in a minute.",
    cf_not_set_up:"Bourdain can't be opened from this address yet. Use your home address for now.",
    ai_budget:`That's this month's AI allowance used up. It resets on the 1st${store.me&&!store.me.is_admin?"; ask Zein if you need more":""}.`,
  };
  if(c==="ai_limit"){ // daily limit for one kind of job; more tomorrow
    const what={import:"imports and photo guesses",scan:"fridge scans",ideas:"recipe ideas",cover:"covers",cost:"cost estimates"}[e.kind]||"AI requests", n=e.limit;
    return `You've used today's ${n?n+" ":""}${what}. More tomorrow.`;
  }
  if(m[c]) return m[c];
  return reachError(e) || `Something went wrong ${what}. Try again.`;
}
/* When the answer didn't come from Bourdain itself (2.5.9). Either nothing came
   back at all (no signal, or the connection dropped on the way), or something in
   between (Cloudflare, mostly) answered with its own error page, which has a
   status but none of our codes. Say which, with the number, so it can be looked
   up; never "check the server" when the server may be fine. Null otherwise. */
function reachError(e){
  if(!e||!e.status) return navigator.onLine===false
    ? "You're offline. Connect to Wi-Fi or mobile data, then try again."
    : "Couldn't get through to Bourdain. Check your connection and try again. If it keeps happening, tell Zein.";
  if(/^http_/.test(e.code||"")) return `The connection to Bourdain sent back an error (${e.status}) before it got there. Try again in a minute. If it keeps happening, tell Zein the number.`;
  return null;
}

        const sheets=await videoToSheets(f,room,p=>{ status.innerHTML=`<span class="spin"></span>Pulling frames… ${p}%`; });

/* Screenshots straight off a phone can be several MB each, which makes the upload
   slow and can go over the API's per-image limit. 1568px on the long edge is plenty
   for reading text. If shrinking fails for any reason, send the original. */
async function forReading(file){
  try{ const b=await shrink(file,1568); return b.size<file.size ? b : file; }
  catch(e){ console.warn("couldn't shrink image, sending original",e); return file; }
}

/* Screen recording -> contact sheets of distinct frames (all on-device).
   Recipe reels flash each ingredient up as a small caption for a second or so, so
   the frames have to be big enough to read and the right ones have to be picked:
   - three frames per sheet, side by side (stacked for a landscape video), so each
     frame keeps about a third of the reader's 1568px instead of a sixth;
   - change is measured per block of a 120px-wide greyscale copy, so a caption that
     changes one corner counts even when the rest of the frame barely moves;
   - when there are more distinct frames than room, the most repetitive ones go
     first, and a frame that stayed on screen longer counts for more.
   Only the small copies are kept while scanning; the picked frames are drawn full
   size in a second pass, so a long recording doesn't fill the phone's memory. */
function videoToSheets(file,maxSheets,onProgress){
  const PER=3, TW=120, BL=6;
  return new Promise((resolve,reject)=>{
    const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.preload="auto"; v.setAttribute("playsinline","");
    const url=URL.createObjectURL(file); v.src=url;
    const fail=e=>{ URL.revokeObjectURL(url); reject(e||new Error("video")); };
    v.onerror=()=>fail();
    let loaded=false; setTimeout(()=>{ if(!loaded) fail(new Error("video never loaded")); },20000);
    v.onloadedmetadata=async()=>{
      loaded=true;
      try{
        const dur=v.duration; if(!isFinite(dur)||dur<=0) return fail();
        const W=v.videoWidth||720, H=v.videoHeight||1280, tall=H>=W;
        // Portrait: 3 across, ~1566px wide. Landscape: 3 stacked, ~1566px tall.
        const fw=tall?522:Math.round(522*W/H), fh=tall?Math.round(522*H/W):522;
        const th=Math.max(BL,Math.round(TW*H/W));
        const tiny=document.createElement("canvas"); tiny.width=TW; tiny.height=th; const tc=tiny.getContext("2d",{willReadFrequently:true});
        const grey=()=>{ tc.drawImage(v,0,0,TW,th); const d=tc.getImageData(0,0,TW,th).data, g=new Uint8Array(TW*th);
          for(let k=0,j=0;k<d.length;k+=4,j++) g[j]=(d[k]*77+d[k+1]*150+d[k+2]*29)>>8; return g; };
        // The most any one block changed between two small copies (0-255).
        const bx=Math.ceil(TW/BL), by=Math.ceil(th/BL);
        const change=(a,b)=>{ const sums=new Float64Array(bx*by), n=new Uint16Array(bx*by);
          for(let y=0;y<th;y++) for(let x=0;x<TW;x++){ const j=y*TW+x, q=Math.floor(y/BL)*bx+Math.floor(x/BL); sums[q]+=Math.abs(a[j]-b[j]); n[q]++; }
          let m=0; for(let q=0;q<sums.length;q++) if(n[q]) m=Math.max(m,sums[q]/n[q]); return m; };
        // Some iOS recordings never fire "seeked" for certain times; give each seek 3s, then move on.
        let stuck=0;
        const seek=t=>new Promise(res=>{ const done=ok=>{ clearTimeout(tm); v.removeEventListener("seeked",onSeeked); if(!ok) stuck++; res(); };
          const onSeeked=()=>done(true); const tm=setTimeout(()=>done(false),3000);
          v.addEventListener("seeked",onSeeked); v.currentTime=Math.min(t,dur-0.05); });
        const steps=Math.min(120,Math.max(12,Math.round(dur*3)));
        const seen=[]; // {t, g, w}: samples that differ from the last one kept, w = how many samples it stands for
        for(let i=0;i<steps;i++){
          const t=dur*i/steps; await seek(t);
          if(stuck>=5) throw new Error("video seeking stalled"); // this recording won't seek; stop rather than crawl
          const g=grey(), last=seen[seen.length-1]; if(!last||change(g,last.g)>8) seen.push({t,g,w:1}); else last.w++;
          if(onProgress&&i%3===0) onProgress(Math.round(i/steps*85));
        }
        // Too many? Repeatedly drop the frame that's most like a neighbour, counting a
        // frame that stayed on screen longer (a caption held still) as worth more, until
        // they fit. Dropping one hands its time to the neighbour it was most like.
        const want=PER*maxSheets;
        const gap=seen.slice(1).map((s,i)=>change(seen[i].g,s.g)); // gap[i]: seen[i] vs seen[i+1]
        while(seen.length>want){
          let best=-1, bc=Infinity;
          for(let i=0;i<seen.length;i++){ const d=Math.min(i>0?gap[i-1]:Infinity,i<gap.length?gap[i]:Infinity); if(d*seen[i].w<bc){ bc=d*seen[i].w; best=i; } }
          const i=best, toLeft=i>0&&(i===gap.length||gap[i-1]<=gap[i]);
          seen[toLeft?i-1:i+1].w+=seen[i].w;
          if(i>0&&i<gap.length) gap.splice(i-1,2,change(seen[i-1].g,seen[i+1].g)); else gap.splice(i>0?i-1:0,1);
          seen.splice(i,1);
        }
        const pick=seen;
        const sheets=[], frame=document.createElement("canvas"); frame.width=fw; frame.height=fh; const fc=frame.getContext("2d");
        for(let sIx=0;sIx<pick.length;sIx+=PER){
          const grp=pick.slice(sIx,sIx+PER);
          const sheet=document.createElement("canvas"); sheet.width=tall?fw*grp.length:fw; sheet.height=tall?fh:fh*grp.length; const sc=sheet.getContext("2d");
          sc.fillStyle="#000"; sc.fillRect(0,0,sheet.width,sheet.height);
          for(let i=0;i<grp.length;i++){
            await seek(grp[i].t); fc.drawImage(v,0,0,fw,fh);
            sc.drawImage(frame,tall?i*fw:0,tall?0:i*fh);
          }
          const blob=await new Promise(r=>sheet.toBlob(r,"image/jpeg",.85)); if(blob) sheets.push(blob);
          if(onProgress) onProgress(85+Math.round((sIx+PER)/pick.length*15));
        }
        URL.revokeObjectURL(url);
        resolve(sheets);
      }catch(e){ fail(e); }
    };
    v.load();
  });
}

        r.tags&&r.tags.length?`Tags: ${r.tags.join(", ")}`:"",

      : (e&&e.code==="blocked_address") ? "That link points inside a private network, so Bourdain won't open it. Use a public recipe link, or paste the text."
      : aiError(e, "fetching that page");
  }
};
const INSTAGRAM_NO_CAPTION="Instagram didn't hand over the caption. Open the post, copy the caption and paste it into the box above, or add screenshots or a screen recording, then tap Read recipe.";
