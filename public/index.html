<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Bourdain</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bourdain">
<meta name="theme-color" content="#ffffff">
<!-- Filled in by server.js when it serves this file, so the app knows which build it is. -->
<meta name="app-version" content="__APP_VERSION__">
<meta name="app-commit" content="__APP_COMMIT__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking the first paint: on a slow connection the app shows in
     Georgia/Helvetica first and switches to the real fonts when they arrive. -->
<link media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#121212; --ink-2:#363636; --ink-3:#727272;
  --line:#DFDFDF; --rule:#121212; --steel:#F7F7F7; --flame:#D3072B; --flame-ink:#FFFFFF;
  --red:#D0021B; --ok:#1A7F37;
  --shadow:none; --r:3px;
  color-scheme:light;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --sans:"Libre Franklin","Helvetica Neue",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* The app shell (2.6.5). The page never scrolls; <main> does, and it fills the
   screen between the header and the tab bar. 2.6.1 had this but let the page
   rubber-band, so after a zoom iPhone dragged the page instead of <main>. 2.6.2
   scrolled the page instead, and on some iPhones the fixed tab bar and sticky
   header then drifted with the content during a fast swipe. Now the page is held
   still (overflow hidden, no overscroll), so neither can happen. */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
/* 2.7.1: the body is pinned to the screen like the tab bar is. On an iPhone home-screen
   app, height:100% stopped short of the home bar, so the page was cut off in a hard
   line under the floating tab bar; fixed to all four edges, it reaches the bottom. */
body{position:fixed;inset:0;height:auto;padding-top:env(safe-area-inset-top,0px)} /* the notch, as html's padding gave it before */
html.sheet-open main{overflow:hidden}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif);
  font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
.kicker{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* A quick second tap is a tap, not a zoom (2.6.3); pinch zoom still works. */
button,a,input,select,textarea,label,.ck,.slot,.rcard{touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Header */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:var(--paper);
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  padding:12px 18px 8px; border-bottom:1px solid var(--rule);
}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.brand{background:none;border:0;padding:6px 0;margin:-6px 0;font:inherit;color:inherit;display:inline-flex;align-items:baseline;gap:8px;min-height:44px}
.brand .ver{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.rel{border-top:1px solid var(--line);padding:10px 0}
.rel h4{font-family:var(--sans);font-size:14px;font-weight:700;margin:0 0 4px}
.rel h4 .faint{font-weight:500;font-size:12px;margin-left:6px}
.rel ul{margin:0;padding-left:18px;font-size:15px;line-height:1.45}
.rel li{margin-bottom:3px}
.vernote{font-family:var(--sans);font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--steel);margin:4px 0 8px}
.vernote.stale{border-color:var(--flame);color:var(--ink)}
.top .sub{font-family:var(--sans);color:var(--ink-3);font-size:11px;font-weight:500;letter-spacing:.02em}
.top .sync{color:var(--ink);font-weight:700}

/* Where the floating tab bar sits (2.7.2): low, like Instagram's, its bottom 12px into
   the iPhone's home-bar area (22px above the screen's edge); 10px on a phone without
   one. The page's end and the toast are measured from it. */
:root{--tabgap:max(10px, calc(env(safe-area-inset-bottom,0px) - 12px))}
main{flex:1; min-height:0; overflow-y:auto; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; padding:0 0 calc(var(--tabgap) + 60px)} /* the tab bar (68px) plus about 16px, with the page's own 24px */
.signinbar{display:block;width:100%;min-height:48px;border:0;border-bottom:1px solid var(--rule);background:var(--flame);color:var(--paper);font-family:var(--sans);font-size:14px;font-weight:600;padding:10px 18px;text-align:left}
.signinbar[hidden]{display:none}
section.view{display:none; padding:16px 18px 24px; max-width:760px; margin:0 auto; width:100%}
section.view.active{display:block}

/* Tabs (2.7.0): a frosted pill floating above the page, the content blurred behind
   it. Capped at 500px and centred, so on an iPad it sits under the content like a
   dock instead of spreading five tabs across the screen. */
.tabs{
  position:fixed; left:14px; right:14px; bottom:var(--tabgap); z-index:5;
  max-width:500px; margin:0 auto;
  display:grid; grid-template-columns:repeat(5,1fr); gap:2px; padding:6px;
  background:rgba(255,255,255,.72); -webkit-backdrop-filter:blur(18px) saturate(180%); backdrop-filter:blur(18px) saturate(180%);
  border:1px solid rgba(18,18,18,.08); border-radius:999px;
  box-shadow:0 10px 30px rgba(18,18,18,.16), 0 1px 3px rgba(18,18,18,.08);
}
.tabs button{
  background:none; border:0; min-height:54px; padding:6px 2px 5px; border-radius:999px;
  font-family:var(--sans); color:var(--ink-3); font-size:10px; font-weight:500; letter-spacing:.01em; white-space:nowrap;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink);font-weight:700;background:rgba(18,18,18,.08)}
.tabs button.on svg{stroke:var(--ink);stroke-width:2.3}

/* Generic controls */
.btn{
  border:1px solid var(--ink); background:var(--card); border-radius:999px;
  padding:9px 16px; font-family:var(--sans); font-weight:500; font-size:13px; letter-spacing:.01em;
}
.btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:600}
.btn.ghost{background:transparent}
.btn.accent{background:var(--flame); color:var(--flame-ink); border-color:var(--flame); font-weight:600}
.btn.danger{color:var(--red); border-color:var(--red)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:6px 12px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-family:var(--sans);font-size:12px;color:var(--ink-2);letter-spacing:.02em}
/* 2.5.3: where a link can come from, under the import link box. Plain ink, like the rest of the UI furniture */
.srcicons{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--sans);font-size:12px;color:var(--ink-2)}
.srcicons li{display:flex;align-items:center;gap:6px}
.srcicons svg{width:20px;height:20px;flex:none;color:var(--ink)}
.input,textarea.input,select.input{
  width:100%; border:1px solid var(--line); background:var(--card); border-radius:var(--r);
  padding:10px 12px; font-size:16px; font-family:var(--sans); border-radius:var(--r);
}
textarea.input{min-height:120px;resize:vertical;line-height:1.4}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.small{font-size:14px}
.hint{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin:4px 0 0;line-height:1.5}

/* Recipes */
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar .input{flex:1}
.searchbar .btn{width:46px;height:46px;padding:0;flex:none;font-size:22px;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap; border:1px solid var(--line); background:var(--card);
  border-radius:999px; padding:5px 12px; font-family:var(--sans); font-size:12px; font-weight:500;
}
.chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.rlist .empty{grid-column:1/-1}
/* List view (2.6.0): one recipe per row, the picture small on the left, no tags.
   It's a per-phone choice (listPrefs.view) and applies to every recipe list. */
body.aslist .rlist{grid-template-columns:1fr;gap:0}
body.aslist .rcard{flex-direction:row;align-items:center;gap:12px;padding:8px 0;min-height:72px}
body.aslist .rcard .thumb{width:56px;height:56px;flex:none;margin:0;font-size:24px}
body.aslist .rcard .body{padding:0}
body.aslist .rcard h3{font-size:17px;-webkit-line-clamp:2;margin-bottom:2px}
body.aslist .rcard .tags{display:none}
.opt.planned{color:var(--ink-3)}
.viewtog{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--ink-2);display:flex;align-items:center;justify-content:center;padding:0}
.viewtog svg{width:18px;height:18px;display:block}
.viewtog[data-as="list"] .vt-grid,.viewtog[data-as="grid"] .vt-list{display:none}
.rcard{
  display:flex; flex-direction:column; text-align:left; width:100%;
  background:none; border:0; border-top:1px solid var(--line); padding:0 0 6px;
}
.rcard .thumb{aspect-ratio:1/1;width:100%;margin-top:8px;background:var(--steel);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-family:var(--serif);font-weight:700;font-size:44px}
.rcard .body{padding:8px 0 0;flex:1;min-width:0}
.rcard h3{font-size:19px;line-height:1.2;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rcard .meta{font-family:var(--sans);font-size:12px;color:var(--ink-3)}
.rcard .tags{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.tag{font-family:var(--sans);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--steel);color:var(--ink-2)}

.empty{
  border-top:1px solid var(--rule); border-bottom:1px solid var(--line); padding:28px 18px; text-align:center; color:var(--ink-2);
}
.empty h3{color:var(--ink);font-size:24px;margin-bottom:6px}

/* Detail */
.revhint{margin-bottom:12px}
.verbtns{margin-bottom:12px}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.detail-head .btn{min-height:44px;padding:0 16px;font-size:13px}
.detail h2{font-size:34px;line-height:1.08;margin-bottom:8px;letter-spacing:-.02em}
.detail .meta{font-family:var(--sans);color:var(--ink-3);font-size:12.5px}
.detail .source{font-family:var(--sans);font-size:12.5px;word-break:break-all}
.detail .source a{color:var(--flame)}
.detail p.muted{font-family:var(--serif);font-size:18px;line-height:1.5;color:var(--ink-2);margin:6px 0 10px}
.detail h3{font-family:var(--sans);font-size:13px;letter-spacing:.02em;text-transform:uppercase;font-weight:700;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ing li .q{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.ing li .prep{color:var(--ink-2)}
.ing .sec{grid-column:1/-1;font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);border:0;padding:14px 0 4px}
.steps{padding-left:0;margin:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:block;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li::before{display:block;margin-bottom:2px}
.steps li::before{content:"Step " counter(s);font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3);line-height:1.9;white-space:nowrap}
.actions{display:flex;gap:8px;margin:20px 0 6px;flex-wrap:wrap}
.actions.quad{display:grid;grid-template-columns:1fr 1fr}
.actions.quad .btn{min-height:44px;padding:0 10px}

/* Plan */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.weeknav .wkt{display:block;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.weeknav .btn{width:44px;height:44px;padding:0;flex:none;font-size:20px;line-height:1}
.wk{text-align:center;min-width:0;min-height:44px;background:none;border:0;padding:0 6px;color:inherit;cursor:pointer}
.wk .note{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--flame);margin-top:2px;visibility:hidden}
.weeknav.current .wkt{color:var(--flame)}
.weeknav.current .note{visibility:visible}
.weeknav.current .btn{color:var(--flame);border-color:var(--flame)}
.days{display:flex;flex-direction:column;gap:0}
.day{display:grid;grid-template-columns:56px 1fr 44px;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.day:last-child{border-bottom:1px solid var(--line)}
.day.today .dn{color:var(--flame)}
.dn{line-height:1}
.dn .w{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.dn .d{font-family:var(--serif);font-weight:700;font-size:30px}
.day.today .dn .w{color:var(--flame)}
/* nothing planned today: a filled red + as a nudge. Not ".empty": that class is
   the app's empty-state message and would restyle the whole row. */
.day.today.nomeal .addslot{background:var(--flame);border-color:var(--flame);color:var(--flame-ink)}
.slots{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{
  display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); padding:8px 10px; min-width:0;
}
.slot{width:100%;text-align:left;color:inherit;min-height:44px}
#days .slot{border:0;background:none;padding:4px 0}
.slot .mini{flex:none;width:40px;height:40px;border-radius:4px;overflow:hidden;background:var(--steel);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-family:var(--serif);font-weight:700;font-size:18px}
.slot .mini img{width:100%;height:100%;object-fit:cover;display:block}
.slot .mini.cover{background:var(--paper)}
.slot .mini.cover img{object-fit:contain}
.slot .t{flex:1;min-width:0;font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.addslot{width:44px;height:44px;border:1px solid var(--line);background:none;border-radius:999px;padding:0;color:var(--flame);font-family:var(--sans);font-size:24px;font-weight:400;line-height:1}

/* Archives (the "timeline" view) */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--line);margin-bottom:18px}
.stat{padding:10px 0 12px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.1}
.feedhint{margin:14px 0 0}
/* People (2.1): avatars, the People row and Everyone / Just me in the Archives, profiles */
.av{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;background:var(--steel);color:var(--ink-2);font-family:var(--serif);font-weight:700;border:1px solid var(--line);vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.veg{background:var(--paper)}
.av.veg img{object-fit:contain;padding:8%;box-sizing:border-box}
.pf-or{margin:0 0 6px}
.costline{font-family:var(--sans);font-size:14px;margin:6px 0 10px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.costline small{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}
.savings{font-family:var(--sans);font-size:13px;color:var(--ink-2);margin:-8px 0 16px}
.guessnote{font-family:var(--sans);font-size:13px;line-height:1.45;border-left:3px solid var(--ink);padding:6px 0 6px 10px;margin:4px 0 14px}
.guessnote b{display:block;font-size:13px}
.guessnote.low{border-left-color:var(--flame)}
.guessnote.low b{color:var(--flame)}
.guessline.low{color:var(--flame)}
.vegs{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:4px;margin:0 0 14px}
.vegpick{height:48px;border:1px solid var(--line);border-radius:50%;background:var(--paper);padding:5px;aspect-ratio:1;justify-self:center;overflow:hidden} /* 2.5.7: clip the picture to the circle, or its white square corners cover the ring */
.vegpick img{width:100%;height:100%;object-fit:contain;display:block}
.vegpick.on{border:2px solid var(--flame)}
.pf-mbti,.mbti-rand{min-height:44px}
.pf-mbti{margin:0 0 12px}
.mbti{margin:0 0 14px}
.mbti-g{margin:0 0 8px}
.mbti-h{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 4px}
.mbti-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mbtype{min-height:44px;border:1px solid var(--line);border-radius:22px;background:var(--paper);font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink)}
.mbtype.on{border:2px solid var(--flame)}
.mbti-say{font-family:var(--sans);font-size:14px;margin:10px 0 4px;min-height:1.4em}
.av.xs{width:18px;height:18px;font-size:10px;margin-right:5px;border:0}
.av.sm{width:32px;height:32px;font-size:15px}
.av.md{width:44px;height:44px;font-size:19px}
.av.lg{width:72px;height:72px;font-size:30px}
.people{display:flex;gap:6px;overflow-x:auto;margin:0 -4px 12px;padding:2px 4px 4px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:var(--ink);font-family:var(--sans);font-size:11px;font-weight:500;min-height:44px}
.person span:last-child{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;padding:3px;margin:0 0 16px}
.seg button{min-height:38px;border:0;background:none;border-radius:999px;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:600}
.tl-sub .av.xs{margin-top:-2px}
.fromline{display:inline-flex;align-items:center;gap:0;background:none;border:0;padding:0;margin:4px 0 2px;min-height:44px;font-family:var(--sans);font-size:13px;color:var(--flame);font-weight:600;text-align:left}
.fromline.who{color:var(--ink-2);font-weight:500}
.fromline.who .cstars{margin-left:8px}
.rcard .owner{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px;font-family:var(--sans);font-size:12px;color:var(--ink-2);margin:0 0 3px}
.inyours{color:var(--flame);font-weight:600}
.others-head{margin-top:26px}
.btn.wide{width:100%;min-height:48px;font-size:15px}
.profile{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.profile h2{margin:0 0 4px}
.profile-edit{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.profile-edit .btn{min-height:44px;padding:0 16px}
.stat .of{font-size:16px;font-weight:600;color:var(--ink-3)}
.stat span{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3)}
.tl-head{font-family:var(--sans);font-size:13px;letter-spacing:.02em;text-transform:uppercase;font-weight:700;margin:22px 0 0;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.tl-head:first-child{margin-top:0}
.tl-top{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.slot .n{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.slot .tl-sub{display:block;font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-3);margin-top:2px}
.slot .tl-sub .mstars{font-size:12px}
.feed .day{grid-template-columns:56px 1fr}
/* The owner's control room (2.4): a ledger, not a dashboard. Rules, type and space do the work; red only when something needs you. */
.verhead{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.adm-kicker{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:2px 0 2px}
.adm-title{margin:0 0 2px;overflow-wrap:anywhere}
.adm-meta{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin:0 0 12px;overflow-wrap:anywhere}
.adm-attn{border-top:2px solid var(--flame);border-bottom:1px solid var(--line);padding:8px 0 10px;margin:0 0 14px}
.adm-attn h3{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--flame);margin:0 0 4px}
.adm-attn ul{margin:0;padding-left:18px;font-family:var(--sans);font-size:13px;line-height:1.45}
.adm-ok{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin:0 0 12px}
.adm-metrics{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--line)}
.adm-metrics.four{grid-template-columns:repeat(4,1fr)}
.adm-m{padding:10px 4px;text-align:center;min-width:0}
.adm-m+.adm-m{border-left:1px solid var(--line)}
.adm-m b{display:block;font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.adm-m span{display:block;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
@media (max-width:480px){
  .adm-metrics{grid-template-columns:repeat(3,1fr)}
  .adm-metrics .adm-m:nth-child(3n+1){border-left:0}
  .adm-metrics .adm-m:nth-child(n+4){border-top:1px solid var(--line)}
  .adm-metrics.four{grid-template-columns:repeat(2,1fr)}
  .adm-metrics.four .adm-m{border-left:1px solid var(--line);border-top:0}
  .adm-metrics.four .adm-m:nth-child(odd){border-left:0}
  .adm-metrics.four .adm-m:nth-child(n+3){border-top:1px solid var(--line)}
}
.adm-today{font-family:var(--sans);font-size:12px;color:var(--ink-2);margin:8px 0 0}
.adm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);margin:22px 0 0;min-height:44px}
.adm-head h3{font-family:var(--sans);font-size:13px;letter-spacing:.02em;text-transform:uppercase;font-weight:700;margin:0;padding-bottom:6px}
.adm-head h3 .n{color:var(--ink-3);font-weight:600;margin-left:4px}
.adm-link{background:none;border:0;padding:0 0 6px;min-height:44px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;align-items:flex-end}
.adm-link.wide{width:100%;align-items:center;padding:0;border-bottom:1px solid var(--line)}
.adm-h{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:14px}
.adm-h .dot{width:8px;height:8px;border-radius:50%;background:var(--ink);align-self:center}
.adm-h.problem .dot,.adm-h.warn .dot{background:var(--flame)}
.adm-h.unknown .dot,.adm-h.off .dot{background:none;border:1.5px solid var(--ink-3);box-sizing:border-box}
.adm-h .lbl{min-width:0}
.adm-h small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.adm-h .st{font-weight:600;text-align:right}
.adm-h.problem .st,.adm-h.warn .st{color:var(--flame)}
.adm-h.unknown .st,.adm-h.off .st{color:var(--ink-3);font-weight:500}
.adm-sum{font-family:var(--sans);font-size:14px;margin:10px 0 2px}
.adm-p{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;min-height:44px;color:var(--ink)}
.adm-p .nm{display:block;font-family:var(--serif);font-size:17px;font-weight:700;overflow-wrap:anywhere}
.adm-p .ln{display:block;font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-top:2px}
.adm-p .seen{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-3);margin-top:2px}
.paused{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--flame)}
.adm-a{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;min-height:44px;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink)}
.adm-a small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);margin-top:2px}
.adm-h4{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 0}
.adm-big{font-family:var(--sans);font-size:14px;margin:4px 0 2px}
.adm-big b{font-family:var(--serif);font-size:30px}
.adm-tbl{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13px}
.adm-tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3);text-align:right;font-weight:700;padding:8px 0 4px 8px}
.adm-tbl td{text-align:right;padding:8px 0 8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.adm-tbl th:first-child,.adm-tbl td:first-child{text-align:left;padding-left:0}
.adm-tbl td:first-child{white-space:normal;overflow-wrap:anywhere}
.adm-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 6px}
.adm-filters #actQ{grid-column:1/-1}
.adm-filters .input{min-height:44px}
.adm-steps{padding-left:20px;margin:0 0 10px;font-family:var(--sans);line-height:1.5}
.adm-top{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.adm-who{display:flex;flex-direction:column;min-width:0;font-family:var(--sans);font-size:12px;color:var(--ink-3)}
.adm-who span{overflow-wrap:anywhere}
.adm-use{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 4px}
.adm-use div{border:1px solid var(--line);border-radius:6px;padding:6px 2px;text-align:center;font-family:var(--sans);font-size:10px;color:var(--ink-3)}
.adm-use b{display:block;font-size:16px;color:var(--ink)}
.adm-use small{font-size:11px;font-weight:500;color:var(--ink-3)}
.adm-use .full b{color:var(--flame)}
.adm-btns{margin-top:10px}
.adm-btns .btn{min-height:44px;padding:0 16px;font-size:13px}
.adm-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:14px}
.adm-row span:last-child{text-align:right;overflow-wrap:anywhere}
.adm-note{margin:8px 0}
.adm-lims{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin-top:10px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-family:var(--sans);font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--flame)}
.adm-act{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:13px;line-height:1.35}
.adm-act .t{color:var(--ink-3);font-size:12px}
.adm-act i{font-style:normal;font-family:var(--serif);font-weight:600;overflow-wrap:anywhere}
.feed .day:first-of-type{border-top:0}

/* Picker sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.sheet-bg.open{display:block}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--card);
  border-radius:12px 12px 0 0; border-top:1px solid var(--line); padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:75%; overflow-y:auto; display:none; box-shadow:0 -8px 30px rgba(0,0,0,.15);
}
.sheet.open{display:block}
.sheet h3{font-size:24px;margin-bottom:10px}
.sheet .opt{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;font-size:17px;font-family:var(--serif);font-weight:600}
.sheet .opt small{display:block;font-family:var(--sans);color:var(--ink-3);font-size:12.5px}

/* Shop */
.shop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.aisle{margin-bottom:18px}
#pantryList .aisle:last-child{margin-bottom:0} /* the page's end is set by <main> (2.7.2) */
.aisle h3{font-family:var(--sans);font-size:13px;letter-spacing:.02em;text-transform:uppercase;font-weight:700;margin-bottom:4px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.item input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--ink);flex:none}
.item .lbl{flex:1;min-width:0}
.item .lbl .q{font-weight:600}
.item.done .lbl{text-decoration:line-through;color:var(--ink-3)}
.item .from{font-family:var(--sans);font-size:12px;color:var(--ink-3)}
/* From the pantry: ticked from the start; the tag is inline-block so the strike-through doesn't reach it */
.ptag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--steel);border:1px solid var(--line);font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink-2);vertical-align:2px}
.shopacts{display:flex;gap:8px;margin-top:14px}
.shopacts .btn{flex:1;min-height:44px}
.item .x{border:0;background:none;color:var(--ink-3);font-size:20px;line-height:1;padding:0;width:44px;height:44px;margin:-8px -12px -8px 0;flex:none}
.addline{display:flex;gap:6px;margin-top:6px}
.addline .input{flex:1;min-width:0}
.addline .btn{flex:none;min-width:72px;height:46px}

/* Import */
.import-tabs{display:flex;gap:6px;margin-bottom:12px}
.import-tabs .chip{padding:7px 13px;font-size:14px}
.drop{
  border:1px dashed var(--line); border-radius:var(--r); padding:18px; text-align:center; color:var(--flame); font-family:var(--sans); font-size:14px; font-weight:500;
  background:var(--card);
}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.status{margin-top:12px;font-family:var(--sans);font-size:13px;color:var(--ink-2)}
.status.err{color:var(--red)}
/* each ingredient is its own grey card, so rows read apart on a phone */
.ingrow{display:grid;grid-template-columns:22px 68px 80px 1fr 32px;gap:6px;margin-bottom:10px;align-items:center;background:var(--steel);border:1px solid var(--line);border-radius:6px;padding:8px 6px 8px 2px}
.ingrow .h{color:var(--ink-3);font-size:18px;text-align:center;white-space:nowrap;letter-spacing:-3px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;grid-row:1/3;align-self:center}
.ingrow.dragging{opacity:.55;outline:2px solid var(--flame);outline-offset:-2px}
.ingrow .input{padding:8px 8px;font-size:16px} /* 16px: iPhone Safari zooms in on any smaller field (2.6.3) */
.ingrow .aisle-sel{grid-column:2/4}
.ingrow .input[data-f=quantity]{padding-left:6px;padding-right:6px}
.ingrow .x{border:0;background:none;color:var(--ink-3);font-size:20px;width:44px;height:44px;padding:0;margin:-5px -6px;justify-self:center}
.ingrow.two{grid-template-columns:1fr 1fr 28px}
.review h2{font-size:28px;margin-bottom:12px}
.review h3{font-family:var(--sans);font-size:13px;letter-spacing:.02em;text-transform:uppercase;font-weight:700;margin:22px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--flame);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* Photos */
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.photos .ph{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--steel)}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
/* the × is a 44px tap area; the dark circle is the span inside it */
.photos .ph .x,.thumbs .x{position:absolute;top:0;right:0;width:44px;height:44px;border:0;background:none;padding:3px;display:flex;align-items:flex-start;justify-content:flex-end}
.photos .ph .x span,.thumbs .x span{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:24px;text-align:center}
.thumbs .tw{position:relative;display:inline-block}
.photos .add{width:88px;height:88px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--ink-2);font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center}
.hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:0;display:block;margin:12px 0 4px;background:var(--steel)}
.photos .ph,.photos .add{border-radius:var(--r)}
.rcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
/* Covers are illustrations on a transparent background: show them whole, on the page's own white, never on a grey tile */
.rcard .thumb.cover{background:var(--paper)}
.rcard .thumb.cover img{object-fit:contain}
.hero.cover{aspect-ratio:1/1;object-fit:contain;background:var(--paper);max-width:420px;margin:8px auto 0}
.allow{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin:6px 0 0}
.allow.none{color:var(--flame)}
.allowbox{border-top:1px solid var(--line);padding-top:12px;margin:4px 0 14px}
.allowbox .sec-h{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
.arow{margin:0 0 10px}
.arow-t{display:flex;justify-content:space-between;font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-bottom:4px}
.abar{height:4px;background:var(--steel);border-radius:2px;overflow:hidden}
.abar i{display:block;height:100%;background:var(--ink)}
.arow.low .abar i{background:var(--flame)}
.arow.low .arow-t span:last-child{color:var(--flame)}
.coverpick{display:block;margin:4px auto 0;min-height:44px;border:0;background:none;font-family:var(--sans);font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.hero.cover{cursor:pointer}
.coverchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 4px}
.cc{position:relative}
.ccpick{display:block;width:100%;aspect-ratio:1/1;padding:4px;border:2px solid var(--line);border-radius:10px;background:var(--paper)}
.ccpick.on{border-color:var(--flame)}
.ccpick img{width:100%;height:100%;object-fit:contain;display:block}
.cc .x{position:absolute;top:0;right:0;width:44px;height:44px;border:0;background:none;padding:3px;display:flex;align-items:flex-start;justify-content:flex-end}
.cc .x span{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:24px;text-align:center}
.coverbox{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.coverbox img{width:112px;height:112px;object-fit:contain;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
/* Reorder */
.ing.reorder li{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;grid-template-columns:24px 78px 1fr;background:var(--card);border-radius:8px;border:1px solid var(--line);margin-bottom:4px;padding:8px 8px}
.ing.reorder li .h{color:var(--ink-3);font-size:18px;line-height:1;text-align:center}
.ing.reorder li.dragging{opacity:.5;border-color:var(--flame)}
.ing.reorder li.over{border-color:var(--flame);border-style:dashed}
.subhead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.subhead h3{margin:0;border:0;padding:0}
#shopTitle,#view-import h2{font-size:28px!important}
.scaler{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin:10px 0 2px}
.scaler .lab{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.scaler .ctl{display:flex;align-items:center;gap:8px}
.scaler .ctl button{border:1px solid var(--ink);background:var(--card);border-radius:var(--r);width:34px;height:34px;font-size:18px;line-height:1;padding:0;font-family:var(--sans)}
.scaler .ctl button:disabled{opacity:.35}
.scaler .amt{font-family:var(--serif);font-weight:700;font-size:19px;min-width:64px;text-align:center}
.scaler .amt small{font-family:var(--sans);font-weight:400;font-size:11px;color:var(--ink-2);display:block;letter-spacing:.06em;text-transform:uppercase}
.scaled{color:var(--flame)}
.scaler .amt small{text-transform:none;letter-spacing:0}
.idea{border-top:1px solid var(--ink);padding:12px 0}
.idea h4{font-family:var(--serif);font-size:20px;font-weight:700;margin:0 0 4px;line-height:1.2;letter-spacing:-.01em}
.idea p{margin:0 0 6px;font-size:16px;line-height:1.45}
.idea .need{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-bottom:8px}
.ideas-head{display:flex;justify-content:space-between;align-items:center;margin:14px 0 0;padding-bottom:6px}
.ideas-head h3{font-family:var(--sans);font-size:13px;letter-spacing:.02em;text-transform:uppercase;font-weight:700;margin:0}
#ideas:not(:empty){margin-bottom:10px}
#pantryList{margin-top:22px}
#pantryList > .empty{margin-top:0}
.scanlist .item .lbl small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-3)}
.scanlist .have{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin:10px 0 0}
/* Cook mode */
.mstars{display:inline-flex;align-items:center;gap:.15em;vertical-align:-.18em;color:var(--flame)}
.mstar{width:1.15em;height:1.15em;display:block}
.rcard .cstars{margin:2px 0 3px;line-height:1}
.rcard .cstars .mstars{font-size:15px;vertical-align:0}
.listctl{display:flex;gap:8px;margin:0 0 10px;align-items:center}
.listctl select{flex:1;min-width:0;min-height:44px;font-size:16px;padding-left:10px;padding-right:6px}
.tmrs{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px 36px}
.tmr{border:1px solid var(--flame);color:var(--flame);background:var(--paper);border-radius:999px;padding:0 14px;min-height:40px;font-family:var(--sans);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tmr.run{background:var(--flame);color:var(--flame-ink)}
.tmr.done{border-color:var(--ink);color:var(--ink);background:var(--steel)}
.timerbar{position:sticky;top:0;z-index:4;background:var(--paper);display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
.timerbar:empty{display:none}
.cookhead{display:flex;align-items:center;gap:8px}
.cookbar{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--flame);border-radius:var(--r);padding:8px 10px 8px 12px;margin:0 0 12px;font-family:var(--sans);font-size:13px}
.cookbar{color:var(--flame)}
.cookbar strong{font-weight:700}
.cookbar .btn{flex:none;min-height:44px;padding:0 18px;font-size:13px}
.cooklist{list-style:none;padding:0;margin:0}
.cooklist li{border-bottom:1px solid var(--line)}
.cooklist .sec{font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:.02em;text-transform:uppercase;padding:14px 0 4px;border:0}
.ck{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:48px;padding:11px 2px;background:none;border:0;text-align:left;font:inherit;color:inherit}
.ck .box{flex:none;width:24px;height:24px;margin-top:1px;border:1.5px solid var(--ink);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:15px;line-height:1;color:var(--paper)}
.ck.done .box{background:var(--ink)}
.ck.done .box::after{content:"✓"}
.ck.done .txt{text-decoration:line-through;color:var(--ink-3)}
.ck .q{font-weight:600}
.ck .n{display:block;font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.steps-ck .txt{font-size:19px;line-height:1.5}

.cookstats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:none;border:0;padding:6px 0;margin:2px 0;font-family:var(--sans);font-size:13px;color:var(--ink-2);text-align:left;min-height:44px}

<script>
/* ---------- constants ---------- */
const AISLES = ["produce","meat & seafood","dairy & eggs","bakery","pantry","spices","frozen","drinks","other"];
const UNITS = ["","g","kg","ml","l","tsp","tbsp","cup","whole","clove","slice","can","packet","bunch","pinch","drizzle","to taste"];
/* How a unit reads on screen. Litres are stored as "l" (renaming a stored value
   would orphan old recipes) but shown as "L", which can't be mistaken for a 1.
   "whole" is the count unit and reads as nothing: "2 eggs", not "2 whole eggs". */
const unitLabel=u=>{ u=String(u||""); return u==="l"?"L":u==="whole"?"":u; };
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- state ---------- */
const state = {
  recipes:{}, plan:{}, shop:{}, pantry:{}, ideas:null,
  week:mondayOf(new Date()), view:"recipes", query:"",
  detailId:null, mult:1, draft:null, editingId:null, images:[], imgMax:10,
};

/* ---------- persistence (server API) ---------- */
const API = "";
async function api(path, opts={}){
  const res = await fetch(API+path, {redirect:"manual", ...opts});
  if(signinLost(res)) throw signin.error();
  if(!res.ok){ let e; try{ e=await res.json(); }catch(_){ e={}; }
    const err=new Error(e.error||res.statusText); err.code=e.code||("http_"+res.status); err.status=res.status; err.detail=e.detail; err.kind=e.kind; err.limit=e.limit; err.seen=e.seen; err.blocked=!!e.blocked; err.source=e.source;
    if(NEEDS_SIGNIN.includes(err.code)) signin.lost(err.code, err.seen);
    if(err.code==="ai_limit"&&err.kind&&err.limit) allowance.full(err.kind,err.limit);
    throw err; }
  if(signin.out) signin.back();
  return res.status===204? null : res.json();
}
/* Signing in (2.3). Through Cloudflare, an expired login doesn't answer with our
   JSON: Cloudflare redirects to its login page (seen here as an opaque redirect,
   since api() doesn't follow redirects) or serves that page itself. Either way,
   and when the server says signed_out, the bar at the top says so and a tap
   reloads the page so Cloudflare can ask. It is never "Offline", and nothing
   waiting is dropped: flush() and the photo queue keep it (keepForLater). */
const NEEDS_SIGNIN=["signed_out","not_trusted","unknown_host","account_disabled"];
const keepForLater=e=>Boolean(e&&["signed_out","not_trusted","unknown_host","account_disabled","signin_unavailable","cf_not_set_up"].includes(e.code));
const PAUSED_MSG="Your Bourdain account is paused, so nothing can be opened or saved. Ask Zein if that's a mistake. Changes you made are kept on this phone.";
// The server says which address it saw, so the owner can check it against TRUSTED_NETS.
const unknownHostMsg=seen=>`Bourdain doesn't open from ${seen?`“${seen}”`:"this address"} at home. Use the NAS's IP address, or add the name to HOME_HOSTS.`;
const untrustedMsg=seen=>`Bourdain doesn't recognise this network${seen?` (it sees this device as ${seen})`:""}. Open it from its web address instead.`;
function signinLost(res){
  if(res.type==="opaqueredirect"||(res.status>=300&&res.status<400)) return true;
  const ct=res.headers.get("content-type")||"";
  return res.ok && res.status!==204 && /text\/html/.test(ct);
}
const signin={
  out:null, // null, or why: "signed_out" | "not_trusted"
  error(){ this.lost("signed_out"); return Object.assign(new Error("signed out"),{code:"signed_out",status:401}); },
  seen:null, // the address the server saw, when it didn't trust the network
  lost(why, seen){
    if(this.out===why&&this.seen===(seen||null)) return;
    this.out=why; this.seen=seen||null;
    const bar=document.getElementById("signinBar");
    bar.textContent = why==="not_trusted" ? untrustedMsg(this.seen) : why==="unknown_host" ? unknownHostMsg(this.seen) : why==="account_disabled" ? PAUSED_MSG : "Signed out. Tap to sign in again.";
    bar.hidden=false; bar.onclick=()=>location.reload();
    store.paint();
  },
  back(){ this.out=null; document.getElementById("signinBar").hidden=true; store.paint(); },
};
const timeout=ms=>AbortSignal.timeout?AbortSignal.timeout(ms):undefined;
/* Every write goes into a persistent outbox first and leaves it only once the
   server has accepted it, so nothing is lost to a dropped connection, a reload,
   or starting the app offline. Unsynced changes are replayed over server data
   on load, so they win. Last write wins: fine for one person. */
const OUTBOX_KEY="bourdain.outbox";
/* The shape of the data this app stores (docs/multi-user.md). It is stamped on
   the offline copy, on every outbox entry and on every write (X-Bourdain-Data).
   Anything stamped newer came from a later app, which can only happen after a
   rollback: the copy is ignored and the writes are set aside, never sent to a
   server that doesn't understand them. They wait in PARKED_KEY for the newer
   app to pick up again. */
const DATA_VERSION=2;
const PARKED_KEY="bourdain.outbox.parked";
/* Since 2.0 this phone's copy and outbox are kept per person, under
   "bourdain:<userId>" and "bourdain.outbox:<userId>", so a different person
   signing in on the same phone never sees them. ME_KEY remembers who was signed
   in last, so the right copy shows before the server answers. The plain keys
   are what 1.x kept; they belong to the owner and are adopted once. */
const ME_KEY="bourdain.me";
const store = {
  online:false,      // did the last request reach the server?
  fromServer:false,  // is state loaded from the server, or only from this device's copy?
  outbox:[], flushing:null,
  loading:true,      // true until the first load from the server succeeds or gives up
  me:null,           // {id, email, name, photo, is_admin} once known
  serverBehind:false,// the server refused a write as too new: it was rolled back, so stop sending
  key(base){ return this.me ? `${base}:${this.me.id}` : base; },
  /* Show this phone's copy straight away, so opening the app never starts on an empty screen. */
  loadLocal(){
    try{ this.me=JSON.parse(localStorage.getItem(ME_KEY)||"null"); }catch(_){ this.me=null; }
    state.recipes={}; state.plan={}; state.shop={}; state.pantry={};
    try{ this.outbox=JSON.parse(localStorage.getItem(this.key(OUTBOX_KEY))||"[]"); }catch(_){ this.outbox=[]; }
    const newer=this.outbox.filter(o=>(o.dv||1)>DATA_VERSION);
    if(newer.length){
      this.outbox=this.outbox.filter(o=>!newer.includes(o));
      try{ const kept=JSON.parse(localStorage.getItem(PARKED_KEY)||"[]"); localStorage.setItem(PARKED_KEY,JSON.stringify([...kept,...newer])); }catch(e){ console.warn("couldn't set aside newer changes",e); }
      this.saveOutbox();
      console.warn("set aside changes from a newer version of the app",newer);
      setTimeout(()=>toast(`${newer.length} change${newer.length===1?"":"s"} from a newer version of the app ${newer.length===1?"was":"were"} set aside, because the server is on an older version. They're kept on this phone.`),0);
    }
    try{ const raw=localStorage.getItem(this.key("bourdain")); if(raw){ const j=JSON.parse(raw);
      if((j.dv||1)<=DATA_VERSION) Object.assign(state,{recipes:j.recipes||{},plan:j.plan||{},shop:j.shop||{},pantry:j.pantry||{}}); } }catch(_){}
    this.applyOutbox();
    this.paint();
  },
  async init(){
    await this.whoami();
    if(!await this.reload()){
      console.warn("couldn't load from the server, using this device's copy");
      const e=this.loadError;
      toast(e&&e.code==="cf_not_set_up" ? "Bourdain can't be opened from this address yet. Use your home address for now."
        : e&&e.code==="signed_out" ? "You're signed out. Tap the red bar at the top to sign in again. This phone's copy is shown until then."
        : e&&e.code==="not_trusted" ? untrustedMsg(e.seen)+" Showing this phone's copy until then."
        : e&&e.code==="unknown_host" ? unknownHostMsg(e.seen)+" Showing this phone's copy until then."
        : e&&e.code==="account_disabled" ? PAUSED_MSG
        : e&&e.code==="signin_unavailable" ? "The server can't check your sign-in right now (it can't reach Cloudflare). Showing this phone's copy; try again in a minute."
        : e&&e.status ? `The server is up but couldn't load your recipes (${e.code}). Showing this phone's copy; check the server logs.`
        : "Can't reach the server. Changes are kept on this phone and sync when it's back.");
    }
    this.loading=false;
    this.paint();
    this.flush();
    window.addEventListener("online",()=>this.sync());
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ this.sync(); if(this.me) allowance.refresh(); } });
    setInterval(()=>{ if(this.outbox.length||photoQueue.pending||!this.fromServer) this.sync(); },30000);
  },
  /* Who's signed in. On the first open after 2.0, this is also where the plain 1.x
     keys move under the owner's name. If someone else was signed in last, their
     copy is put away and this person's is loaded instead. */
  async whoami(){
    let me; try{ me=await api("/api/me",{signal:timeout(10000)}); }catch(e){ return; } // offline, or a 1.x server: keep what we have
    const was=this.me;
    this.me=me; try{ localStorage.setItem(ME_KEY,JSON.stringify(me)); }catch(_){}
    if(!was) this.adoptLegacy(me.is_admin);
    if(!was || was.id!==me.id) this.loadLocal();
    this.unpark();
  },
  /* The plain keys hold what 1.x kept (the owner's) and anything this app queued
     before it knew who was signed in (dv 2, no uid: the person signing in now).
     The admin takes all of it; anyone else takes only the second kind. */
  adoptLegacy(isAdmin){
    try{
      const oldBox=JSON.parse(localStorage.getItem(OUTBOX_KEY)||"[]"), mine=JSON.parse(localStorage.getItem(this.key(OUTBOX_KEY))||"[]");
      const take=oldBox.filter(o=>isAdmin||((o.dv||1)===DATA_VERSION&&!o.uid)).map(o=>({...o,uid:this.me.id}));
      if(take.length) localStorage.setItem(this.key(OUTBOX_KEY),JSON.stringify([...mine.filter(e=>!take.some(o=>o.col===e.col&&o.id===e.id)),...take]));
      const rest=oldBox.filter(o=>!take.some(t=>t.col===o.col&&t.id===o.id));
      if(rest.length) localStorage.setItem(OUTBOX_KEY,JSON.stringify(rest)); else localStorage.removeItem(OUTBOX_KEY);
      if(isAdmin){
        const oldCopy=localStorage.getItem("bourdain");
        if(oldCopy!=null&&localStorage.getItem(this.key("bourdain"))==null) localStorage.setItem(this.key("bourdain"),oldCopy);
        localStorage.removeItem("bourdain");
      }
    }catch(e){ console.warn("couldn't move this phone's copy under your profile",e); }
  },
  /* Changes set aside after a rollback (by 1.x, or by this app when the server
     refused them as too new) go back in the queue once the server is 2.x again.
     Only this version's, and only this person's. */
  unpark(){
    try{
      const parked=JSON.parse(localStorage.getItem(PARKED_KEY)||"[]");
      const back=parked.filter(o=>(o.dv||1)===DATA_VERSION&&(!o.uid||o.uid===this.me?.id));
      if(!back.length) return;
      for(const op of back){ this.outbox=this.outbox.filter(o=>!(o.col===op.col&&o.id===op.id)); this.outbox.push(op); }
      localStorage.setItem(PARKED_KEY,JSON.stringify(parked.filter(o=>!back.includes(o))));
      this.saveOutbox(); this.applyOutbox(); this.paint();
      console.log("picked up changes that were set aside",back);
    }catch(e){ console.warn("couldn't pick up set-aside changes",e); }
  },
  /* Load everything from the server, then lay unsynced changes over it. */
  async reload(){
    try{
      const data=await api("/api/state",{signal:timeout(15000)});
      state.recipes=data.recipes||{}; state.plan=data.plan||{}; state.shop=data.shop||{}; state.pantry=data.pantry||{};
      this.applyOutbox();
      this.online=true; this.fromServer=true; this.local();
      return true;
    }catch(e){ console.warn("load failed",e); this.loadError=e; this.online=false; return false; }
  },
  applyOutbox(){ for(const op of this.outbox){ if(!state[op.col]) continue; if(op.doc==null) delete state[op.col][op.id]; else state[op.col][op.id]=op.doc; } },
  local(){ try{ localStorage.setItem(this.key("bourdain"), JSON.stringify({dv:DATA_VERSION, recipes:state.recipes, plan:state.plan, shop:state.shop, pantry:state.pantry})); }catch(e){} },
  saveOutbox(){ try{ localStorage.setItem(this.key(OUTBOX_KEY), JSON.stringify(this.outbox)); }catch(e){ console.warn("outbox not saved",e); } },
  /* Send queued writes in order. Stops at the first network or server failure and
     keeps the rest; a 4xx means the server will never accept it, so it is dropped. */
  flush(){
    if(this.flushing) return this.flushing;
    this.flushing=(async()=>{
      await photoQueue.flush(); // photos first, so recipes reach the server pointing at real photo ids
      while(this.outbox.length&&!this.serverBehind){
        const op=this.outbox[0];
        const path=`/api/${op.col}/${encodeURIComponent(op.id)}`;
        try{
          const dv={"X-Bourdain-Data":String(op.dv||DATA_VERSION)};
          await api(path, op.doc==null ? {method:"DELETE",headers:dv,signal:timeout(15000)}
            : {method:"PUT",headers:{"Content-Type":"application/json",...dv},body:JSON.stringify(op.doc),signal:timeout(15000)});
          this.online=true;
        }catch(e){
          if(e.code==="data_newer"){ this.setAsideAll(); break; } // the server was rolled back: keep everything for later, send nothing
          if(keepForLater(e)){ console.warn("not signed in, keeping changes for later",e); break; }
          if(e.status>=400&&e.status<500){ op.refused=true; console.error("server refused a change, dropping it",op,e); toast("The server refused one change, so it wasn't kept. Check it and try again."); }
          else { console.warn("sync failed, will retry",e); this.online=false; break; }
        }
        const i=this.outbox.indexOf(op); if(i>=0){ this.outbox.splice(i,1); this.saveOutbox(); } // may already be superseded by a newer write
      }
    })().finally(()=>{ this.flushing=null; this.paint(); });
    return this.flushing;
  },
  setAsideAll(){
    this.serverBehind=true; this.online=false;
    try{ const kept=JSON.parse(localStorage.getItem(PARKED_KEY)||"[]"); localStorage.setItem(PARKED_KEY,JSON.stringify([...kept,...this.outbox])); }catch(e){ console.warn("couldn't set aside changes",e); return; }
    const n=this.outbox.length; this.outbox=[]; this.saveOutbox();
    toast(`The server is on an older version of Bourdain, so ${n===1?"this change is":`these ${n} changes are`} kept on this phone until it's updated.`);
  },
  /* Retry pending writes; if we started from this device's copy, pick up the server's once it's reachable. */
  async sync(){
    if(!this.me) await this.whoami(); // first opened offline: find out who's signed in now it's reachable
    await this.flush();
    if(this.outbox.length||this.fromServer) return;
    if(await this.reload()){ this.paint(); if(!(state.view==="import"&&state.draft)) render(); } // don't wipe a half-edited form
  },
  /* Queue a write and try to send it. Resolves true once the server has it, false if it's waiting on this device. */
  /* Queue a write without sending it. Used inside flush() itself (the photo queue
     swapping ids), where awaiting flush() again would wait on itself forever. */
  enqueue(col,id,doc){
    this.outbox=this.outbox.filter(o=>!(o.col===col&&o.id===id));
    const op={col,id,dv:DATA_VERSION,uid:this.me?.id,doc:doc==null?null:JSON.parse(JSON.stringify(doc))};
    this.outbox.push(op); this.saveOutbox(); this.local(); this.paint();
    return op;
  },
  async write(col,id,doc,verb){
    if(col==="recipes"&&doc) lowerIngredients(doc);
    const op=this.enqueue(col,id,doc);
    if(col==="recipes"&&doc) setTimeout(()=>costs.want(id),0);
    const sending=this.flush();
    if(this.online) await sending; // when the server is already known to be down, don't make the user wait on it
    if(op.refused) return false;
    if(this.serverBehind) return false; // set aside with the rest; setAsideAll already said so
    if(!this.outbox.includes(op)) return true;
    toast(signin.out ? `${verb} on this phone. It'll sync once you sign in again.` : `${verb} on this phone. It'll sync when the server's back.`);
    return false;
  },
  put(col,id,data){ return this.write(col,id,data,"Saved"); },
  del(col,id){ return this.write(col,id,null,"Removed"); },
  paint(){
    const el=document.getElementById("syncSub"); if(!el) return;
    const n=this.outbox.length+photoQueue.pending;
    el.textContent = signin.out ? (signin.out==="account_disabled"?"Paused · ":"Signed out · ") : n ? `${n} change${n===1?"":"s"} not synced · ` : this.loading ? "Loading… · " : (!this.fromServer||!this.online) ? "Offline · " : "";
  },
  /* One of the app's AI jobs (import, scan, ideas, write), run by the server:
     the prompts live there and every call counts against this person's limits.
     Only the material goes from here, never a prompt. */
  async ai(kind, material, images, signal){
    const body={kind, material:material||{}};
    if(images&&images.length){
      body.images=[];
      for(const f of images){ body.images.push({ media_type:f.type||"image/jpeg", data:await toBase64(f) }); }
    }
    const out=await api("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal});
    allowance.took(out&&out.allowance);
    return out.json;
  },
  async fetchUrl(url){ return api("/api/fetch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})}); },
  async uploadPhoto(blob){
    const fd=new FormData(); fd.append("photo",blob,"photo.jpg");
    return api("/api/photos",{method:"POST",body:fd,signal:timeout(30000)});
  },
};
function toBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(new Error("read")); r.readAsDataURL(file); }); }

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function scaleQty(q,mult){
  if(q==null||q==="") return null;
  const n=Number(q); if(!isFinite(n)) return null;
  const v=n*mult;
  if(v>=100) return Math.round(v);
  if(v>=10) return Math.round(v*10)/10;
  return Math.round(v*100)/100;
}
function fmtQty(q){ if(q==null||q==="") return ""; const n=Number(q); if(!isFinite(n)) return String(q);
  const fr={0.25:"¼",0.5:"½",0.75:"¾",0.33:"⅓",0.67:"⅔"}; const w=Math.floor(n), f=+(n-w).toFixed(2);
  const fs = fr[f]||""; if(fs) return (w?w:"")+fs; return String(+n.toFixed(2)); }
function weekLabel(m){ const s=addDays(m,6); return `${m.getDate()} ${MONTHS[m.getMonth()]} – ${s.getDate()} ${MONTHS[s.getMonth()]}`; }
function toast(msg,action){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.toggle("act",!!action);
  // 2.6.1: an optional button, like Undo; the toast stays up longer and can be tapped
  if(action){ const b=document.createElement("button"); b.className="toast-btn"; b.textContent=action.label; b.onclick=()=>{ t.classList.remove("show","act"); clearTimeout(t._h); action.run(); }; t.append(b); }
  t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show","act"),action?6000:Math.max(2200,msg.length*60)); } // long messages stay up long enough to read
// Only http(s) links become links: a "javascript:" source link in someone else's recipe would run in your session.
function webUrl(u){ return /^https?:\/\//i.test(String(u||"").trim()) ? String(u).trim() : ""; }
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function sourceType(u){ const h=hostOf(u); if(/instagram/.test(h))return "instagram"; if(/tiktok/.test(h))return "tiktok"; if(/youtu/.test(h))return "youtube"; if(h)return "web"; return "manual"; }

// Ingredient names and prep are stored lowercase whatever was typed (2.5.1): "Chicken Thigh"
// would otherwise miss "chicken thigh" in the pantry and the shopping list. Changes the doc in
// place, so the screen shows what was saved. raw_text keeps the line as written.
function lowerIngredients(r){
  if(Array.isArray(r.ingredients)) for(const i of r.ingredients) if(i&&typeof i==="object"){
    if(typeof i.item==="string") i.item=i.item.toLowerCase();
    if(typeof i.prep==="string") i.prep=i.prep.toLowerCase();
  }
  return r;
}

/* ---------- navigation ---------- */
// Back to the top of the content (it's <main> that scrolls, never the page; 2.6.5)
const toTop=()=>{ const m=document.getElementById("main"); if(m) m.scrollTop=0; };
function show(view){
  state.view=view;
  if(view!=="detail"&&view!=="cook") state.detailFrom=null; // set by the Timeline so the recipe's Back returns there
  document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("active", s.id==="view-"+view));
  // Which tab stays lit for views that aren't tabs themselves
  const tab = view==="person" ? (state.personFrom==="timeline"?"timeline":"recipes") : view==="admin" ? "recipes"
    : view==="theirs" ? (state.theirs?.from==="person" ? (state.personFrom==="timeline"?"timeline":"recipes") // a friend's recipe, from their profile (2.7.5)
      : {recipes:"recipes",detail:"recipes"}[state.theirs?.from]||"timeline")
    : (view==="detail"||view==="cook"||view==="import") ? (state.detailFrom||"recipes") : view;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.view===tab));
  const sub=document.getElementById("topSub");
  const now=new Date(); sub.textContent = `${DAYS[(now.getDay()+6)%7]} ${now.getDate()} ${MONTHS[now.getMonth()]}`;
  toTop();
  if(view!=="cook") wake.release();
  render();
  nav.sync();
}
/* The phone's back gesture and back button (2.7.4). Screens aren't separate pages, so
   until 2.7.4 Android's back closed the app from anywhere and Safari's swipe left it.
   Now, whenever there's somewhere to go back to (an open sheet, a recipe, a form, any
   tab but Recipes), one history entry sits on top; going back takes it off, and the
   app does what its own Back would: close the sheet, press the screen's Back button,
   or return to Recipes. At Recipes with nothing open there's no entry, so back leaves
   the app as before. */
const nav={
  silent:false,
  sheetOpen(){ return document.getElementById("sheet").classList.contains("open"); },
  needed(){ return this.sheetOpen() || state.view!=="recipes"; },
  sync(){
    const have=!!(history.state&&history.state.bourdain);
    if(this.needed()&&!have) history.pushState({bourdain:1},"");
    else if(!this.needed()&&have){ this.silent=true; history.back(); } // the app's own Back got here: take the entry off quietly
  },
  back(){
    if(this.sheetOpen()){ closeSheet(); return; }
    const v=document.getElementById("view-"+state.view);
    if(state.view==="import"&&state.draft&&!document.getElementById("review").hidden){ leaveReview(); return; } // never lose a recipe to a stray swipe
    const b=v&&["#revBack","#impBack","#cookBack","#back","#tBack","#pBack","#aBack"].map(q=>v.querySelector(q)).find(x=>x&&x.offsetParent);
    if(b) b.click(); else show("recipes");
  },
};
addEventListener("popstate",()=>{
  if(nav.silent){ nav.silent=false; nav.sync(); return; }
  nav.back(); nav.sync();
});
// Back from a recipe that isn't saved yet asks first; the app's own Back button still discards straight away.
function leaveReview(){
  const editing=!!state.editingId;
  const s=openSheet(`<h3>${editing?"Leave without saving your changes?":"Leave this recipe without saving?"}</h3>
    <p class="muted">${editing?"Your changes to this recipe will be lost.":"It isn't in your book yet."}</p>
    <div class="actions"><button class="btn primary" data-act="stay">Keep editing</button><button class="btn danger" data-act="leave">${editing?"Discard changes":"Leave without saving"}</button></div>`);
  sheetActions(s,{ stay:()=>closeSheet(), leave:()=>{ closeSheet(); document.getElementById("revBack").click(); } });
}

/* An unsaved recipe outlives the app (2.7.4). iPhone often closes a home-screen app in
   the background (switching to Instagram to copy a caption, say), and the import or
   edit in progress went with it. It's kept on this phone, for this person, until it's
   saved or discarded, and offered again under "Carry on with …". Screenshots aren't
   kept (too big for the phone's storage); the link, the text and the form are. */
const drafts={
  key(){ return store.key("bourdain.draft"); },
  save(){
    try{
      let d=state.draft;
      if(d&&state.view==="import"&&state.reviewCollect&&!document.getElementById("review").hidden){ try{ d=state.reviewCollect(); }catch(_){} }
      const src={url:document.getElementById("srcUrl").value.trim(), text:document.getElementById("srcText").value};
      if(!d&&!src.url&&!src.text.trim()){ localStorage.removeItem(this.key()); return; }
      localStorage.setItem(this.key(),JSON.stringify({dv:DATA_VERSION, at:new Date().toISOString(), draft:d||null, editingId:d?state.editingId||null:null, draftManual:!!(d&&state.draftManual), src}));
    }catch(e){ console.warn("couldn't keep the draft",e); }
  },
  clear(){ try{ localStorage.removeItem(this.key()); }catch(_){} },
  restore(){
    let j=null; try{ j=JSON.parse(localStorage.getItem(this.key())||"null"); }catch(_){}
    if(!j||(j.dv||1)>DATA_VERSION||state.draft) return;
    if(j.editingId&&!state.recipes[j.editingId]) j.editingId=null; // the recipe it was editing is gone: keep it as a new one
    document.getElementById("srcUrl").value=j.src?.url||""; document.getElementById("srcText").value=j.src?.text||"";
    if(j.draft){ state.draft=j.draft; state.editingId=j.editingId; state.draftManual=!!j.draftManual; }
    const name=j.draft?`“${j.draft.title||"Untitled"}”`:"the import you started";
    setTimeout(()=>toast(j.editingId?`Your changes to ${name} are kept.`:`${name[0].toUpperCase()+name.slice(1)} is kept. It isn't saved yet.`,{label:"Carry on",run:()=>show("import")}),600);
  },
};
let draftTimer=null;
const keepDraft=()=>{ clearTimeout(draftTimer); draftTimer=setTimeout(()=>drafts.save(),400); };
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") drafts.save(); });
addEventListener("pagehide",()=>drafts.save());
document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) show(b.dataset.view); });

/* ---------- render ---------- */
/* How much of the AI allowance is left (2.6.0). The server sends counts and a
   percentage (never prices) in /api/me and with every AI reply. Nothing shows while
   more than half is left; from half, a grey line under the button ("8 imports left
   today") and one toast that day. The month works the same way from 50% used. The
   profile sheet shows all of it. The owner, while exempt, sees "No limits". */
const allowance={
  WORDS:{ import:["import","imports"], scan:["fridge scan","fridge scans"], ideas:["recipe idea","recipe ideas"], cover:["cover","covers"] },
  get(){ return store.me&&store.me.allowance||null; },
  left(g){ const a=this.get(); const t=a&&!a.exempt&&a.today&&a.today[g]; return t ? Math.max(0,(t.limit||0)-(t.used||0)) : null; },
  low(g){ const a=this.get(), n=this.left(g); return n!==null && n<=a.today[g].limit/2; },
  line(g){
    if(!this.low(g)) return "";
    const n=this.left(g), [one,many]=this.WORDS[g]||["request","requests"];
    return n ? `${n} ${n===1?one:many} left today` : `No ${many} left today. More tomorrow.`;
  },
  paint(){ document.querySelectorAll("[data-allow]").forEach(el=>{ const g=el.dataset.allow, t=this.line(g); el.textContent=t; el.hidden=!t; el.classList.toggle("none",this.left(g)===0); }); },
  seenKey(){ return store.key("bourdain.allowanceSeen"); },
  seen(){ try{ return JSON.parse(localStorage.getItem(this.seenKey())||"{}"); }catch(_){ return {}; } },
  // one toast per group per day when it first gets to half, and one per month at 50%
  nudge(g){
    const a=this.get(); if(!a||a.exempt) return;
    const day=iso(new Date()), seen=this.seen(); if(seen.day!==day){ seen.day=day; seen.groups=[]; }
    let msg="";
    if(g&&this.low(g)&&!seen.groups.includes(g)){ seen.groups.push(g); const n=this.left(g), [one,many]=this.WORDS[g];
      msg=n ? `That's ${n} ${n===1?one:many} left today. More tomorrow.` : `That's all your ${many} for today. More tomorrow.`; }
    else if((a.month_pct||0)>=50&&seen.month!==day.slice(0,7)){ seen.month=day.slice(0,7); msg="You've used half of this month's AI allowance."; }
    try{ localStorage.setItem(this.seenKey(),JSON.stringify(seen)); }catch(_){}
    if(msg) setTimeout(()=>toast(msg),2600); // after the job's own "Saved" or "Cover added"
  },
  // the reply to an AI job carries the new count for its group
  took(u){
    if(!u||!store.me) return;
    if(u.exempt){ store.me.allowance={exempt:true}; return; }
    const a=store.me.allowance&&!store.me.allowance.exempt ? store.me.allowance : {exempt:false,today:{}};
    if(u.group) a.today={...(a.today||{}),[u.group]:{used:u.used,limit:u.limit}};
    if(typeof u.month_pct==="number") a.month_pct=u.month_pct;
    store.me.allowance=a; this.paint(); this.nudge(u.group);
  },
  full(g,limit){ const a=this.get(); if(!a||a.exempt||!a.today) return; a.today[g]={used:limit,limit}; this.paint(); },
  async refresh(){ try{ const me=await api("/api/me",{signal:timeout(10000)}); if(store.me&&me&&me.id===store.me.id){ store.me.allowance=me.allowance; this.paint(); } }catch(_){} },
  sectionHtml(){
    const a=this.get(); if(!a) return "";
    if(a.exempt) return `<div class="allowbox" id="pfAllow"><p class="sec-h">Your allowance</p><p class="muted small">No limits (owner).</p></div>`;
    const bar=(used,limit,label,lowNow)=>{ const pct=limit>0?Math.min(100,Math.round(used/limit*100)):100;
      return `<div class="arow${lowNow?" low":""}"><div class="arow-t"><span>${esc(label)}</span><span>${esc(used)} of ${esc(limit)}</span></div><div class="abar"><i style="width:${pct}%"></i></div></div>`; };
    const names={import:"Imports and photo guesses",scan:"Fridge scans",ideas:"Recipe ideas",cover:"Covers"};
    const rows=Object.keys(names).filter(g=>a.today&&a.today[g]).map(g=>bar(a.today[g].used,a.today[g].limit,names[g]+" today",this.low(g))).join("");
    const m=a.month_pct||0, st=a.storage||{};
    return `<div class="allowbox" id="pfAllow"><p class="sec-h">Your allowance</p>${rows}
      <div class="arow${m>=50?" low":""}"><div class="arow-t"><span>AI this month</span><span>${esc(m)}% used</span></div><div class="abar"><i style="width:${Math.min(100,m)}%"></i></div></div>
      ${st.limit_mb?bar(st.used_mb||0,st.limit_mb,"Photos (MB)",(st.used_mb||0)>=st.limit_mb/2):""}
      <p class="muted small">Daily limits reset at midnight; the month resets on the 1st.</p></div>`;
  },
};

function render(){
  if (state.view==="recipes") renderRecipes();
  if (state.view==="detail") renderDetail();
  if (state.view==="plan") renderPlan();
  if (state.view==="shop") renderShop();
  if (state.view==="pantry") renderPantry();
  if (state.view==="timeline") renderTimeline();
  if (state.view==="person") renderPerson();
  if (state.view==="theirs") renderTheirs();
  if (state.view==="admin") renderAdmin();
  if (state.view==="import") renderImport();
  if (state.view==="cook") renderCook();
  allowance.paint();
}


/* Write a screen's HTML only if it changed (2.6.4). Tapping a tab redraws its
   screen; rewriting identical HTML threw away every picture and drew it again, so
   pictures and avatars flashed blank. Handlers on these screens are set on the
   container (el.onclick), so keeping the old children is safe. If anything else
   wrote into `el` since (its first child is no longer the one we wrote), write. */
const FIRST_SCREEN=6; // cards on a phone's first screen or so: never lazy
function setHtml(el,html){
  if(el._html===html&&el._first===el.firstChild&&el.firstChild) return false;
  el.innerHTML=html; el._html=html; el._first=el.firstChild; return true;
}
/* The People row (2.7.3, on the Archives before): you, then everyone else with a
   name; tap one for their profile and recipes. Only once someone else has a name. */
function peopleRowHtml(){
  if(!people.others().length) return "";
  const meP=people.list?.find(p=>p.me)||(store.me?{id:store.me.id,name:store.me.name,photo:store.me.photo,me:true}:null);
  return `<div class="people" role="list">${[meP,...people.others()].filter(Boolean).map(p=>`<button class="person" role="listitem" data-person="${esc(p.id)}" aria-label="${p.me?"You":esc(p.name)}">${avatar(p,"md")}<span>${p.me?"You":esc(firstName(p.name))}</span></button>`).join("")}</div>`;
}
// Search: every word typed has to be somewhere in the recipe: its title, description,
// tags or ingredients (2.7.3: tags are found by searching, with no row of tag buttons).
const searchWords=q=>String(q||"").toLowerCase().split(/\s+/).filter(Boolean);
const recipeMatches=(r,words)=>{ if(!words.length) return true;
  const hay=[r.title,r.description,...(r.tags||[]),...(r.ingredients||[]).map(i=>i&&(i.item||i.raw_text))].join(" ").toLowerCase();
  return words.every(w=>hay.includes(w)); };
function renderRecipes(){
  const pr=document.getElementById("peopleRow");
  if(people.stale()&&!people.loading) people.load(true).then(()=>{ if(state.view==="recipes") setHtml(pr,peopleRowHtml()); });
  setHtml(pr,peopleRowHtml());
  pr.onclick=e=>{ const p=e.target.closest("[data-person]"); if(p) openPerson(p.dataset.person); };
  const q=state.query.trim().toLowerCase();

  const pref=listPrefs.get(), words=searchWords(q);
  const list=Object.entries(state.recipes).filter(([id,r])=>recipeMatches(r,words)).filter(([id,r])=>keepRecipe(r,pref.filter)).sort((a,b)=>sortRecipes(a[1],b[1],pref.sort));
  paintCookBanner();
  const el=document.getElementById("rlist");
  if (!Object.keys(state.recipes).length && store.loading){ setHtml(el,`<div class="empty"><span class="spin"></span>Loading your recipes…</div>`); return; }
  if (!Object.keys(state.recipes).length){
    setHtml(el,`<div class="empty"><h3>Nothing in the book yet</h3>Tap + to import a recipe from a link, caption, screenshots or a screen recording, or to write your own.<div style="margin-top:14px"><button class="btn primary" data-go="add">Add a recipe</button></div></div>`);
    el.querySelector("[data-go]").onclick=()=>addSheet(); return;
  }
  if (!list.length){

    const rb=el.querySelector("[data-reset]"); if(rb) rb.onclick=()=>{ listPrefs.set({...pref,filter:"all"}); renderRecipes(); };
    return;
  }
  setHtml(el,list.map(([id,r],i)=>cardHtml(r,`data-id="${esc(id)}"`,"",i>=FIRST_SCREEN)).join(""));
  el.onclick=e=>{ const c=e.target.closest(".rcard"); if(c){ if(state.detailId!==c.dataset.id) state.mult=1; state.detailId=c.dataset.id; show("detail"); } };
}
document.getElementById("search").addEventListener("input",e=>{ state.query=e.target.value; renderRecipes(); });
// A recipe card. `attrs` says what tapping it opens; `extra` goes under the title (whose recipe it is).
// `lazy`: only for cards below the first screen (2.6.4); the first few load at once, so nothing flashes.
function cardHtml(r,attrs,extra="",lazy=false){
  const L=lazy?'loading="lazy" ':"";
  const t=(r.prep_min||0)+(r.cook_min||0);
  const meta=[t?`${t} min`:null, r.servings?`${r.servings} serves`:null, r.source_type&&r.source_type!=="manual"?r.source_type:null].filter(Boolean).join(" · ");
  return `<button class="rcard" ${attrs}>
    ${r.cover?`<div class="thumb cover"><img ${L}src="${coverUrl(r.cover)}" alt=""></div>`
      :`<div class="thumb">${r.photos&&r.photos.length?`<img ${L}src="${photoUrl(r.photos[0])}" alt="">`:esc((r.title||"?").trim()[0]||"?").toUpperCase()}</div>`}
    <div class="body"><h3>${esc(r.title||"Untitled")}</h3>${extra}${r.rating?`<div class="cstars">${stars(r.rating)}</div>`:""}${meta?`<div class="meta">${esc(meta)}</div>`:""}
    <div class="tags">${(r.tags||[]).slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div></button>`;
}
// "+" asks how, in order of how often it's used (2.6.1): import (link, text,
// screenshots, recording), guess from a photo of a dish, or write one by hand.
function addSheet(){
  const open=state.draft&&!state.editingId ? state.draft : null; // an import or new recipe not saved yet
  const name=open ? `“${esc(open.title||"Untitled")}”` : "";
  const s=openSheet(`<h3>Add a recipe</h3>
    ${open?`<button class="opt" data-act="resume">Carry on with ${name}<small>You haven't saved it yet</small></button>`:""}
    <button class="opt" data-act="import">Import a recipe<small>${open?`Replaces ${name}`:"From a link, pasted text, screenshots or a screen recording"}</small></button>
    <button class="opt" data-act="guess">Guess from a photo of a dish<small>${open?`Replaces ${name}`:"Bourdain suggests a recipe and says how sure it is"}</small></button>
    <button class="opt" data-act="manual">Write one yourself<small>${open?`Replaces ${name}`:"Start from a blank recipe"}</small></button>`);
  sheetActions(s,{
    resume:()=>{ closeSheet(); show("import"); },
    import:()=>{ closeSheet(); state.editingId=null; state.draft=null; state.draftManual=false; show("import"); drafts.save(); },
    manual:()=>{ closeSheet(); state.editingId=null; state.draft=blankRecipe(); state.draftManual=true; show("import"); },
    guess:()=>guessFromPhoto(),

}
